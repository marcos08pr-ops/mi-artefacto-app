// ---- 10-progreso.js ----
/* ============ Enten · Progreso y sincronización ============ */
VIEWS.progreso = function () {
  const R = UI.prog;
  return '<section class="page-h"><h1>Progreso</h1></section>' +
    '<div class="seg">' + [7, 30, 90].map((r) => '<button class="' + (R === r ? 'on' : '') + '" data-act="progRange" data-r="' + r + '">' + r + ' días</button>').join('') + '</div>' +
    syncCard() + weightBlock(R) + stepsBlock(R) + kcalBlock(R) + protBlock(R) + trainBlock() + strengthBlock();
};
ACT.progRange = (el) => { UI.prog = +el.dataset.r; render(); };

function daysBack(n) { const t = today(), out = []; for (let i = n - 1; i >= 0; i--) out.push(addD(t, -i)); return out; }
function syncCard() {
  const ls = S.settings.lastSync;
  return '<section class="card"><div class="card-h"><div><p class="eyebrow">Apple Salud · Fastic · StepsApp</p><h3>' + (ls ? 'Última sincronización: ' + esc(relD(dk(new Date(ls))).toLowerCase()) + ' a las ' + hm(ls) : 'Conecta tus apps') + '</h3></div></div>' +
    '<p class="muted small">Pasos, distancia, kcal activas, peso, agua y, si Fastic las guarda en Salud, las calorías que comes.</p>' +
    '<div class="btn-row"><button class="btn btn-primary" data-act="openSync">' + ic('sync') + (ls ? 'Sincronizar ahora' : 'Configurar') + '</button></div></section>';
}
function weightBlock(R, compact) {
  const pts = weightSeries(R), avgPts = movingAvg(pts, 7), wt = weightTrend(), P = S.profile || {};
  const head = compact ? '' : '<div class="card-h"><div><p class="eyebrow">Peso corporal · media de 7 días</p><h3>' + (avgPts.length ? fmt(avgPts[avgPts.length - 1].y, 1) + ' kg' : 'Sin registros') + '</h3></div><button class="btn btn-sm" data-act="addWeight">' + ic('plus') + 'Peso</button></div>';
  const kp = wt ? '<div class="kpis"><div class="kpi"><b>' + fmtSigned(wt.perWeek, 2) + '</b><span>kg por semana</span></div><div class="kpi"><b>' + fmtSigned(wt.pctWeek, 2) + ' %</b><span>del peso / semana</span></div>' + (P.goalWeight ? '<div class="kpi"><b>' + fmt(P.goalWeight, 1) + '</b><span>objetivo (kg)</span></div>' : '') + '</div>' : '';
  const chart = lineChart({ pts, avg: avgPts, goal: P.goalWeight || null, from: addD(today(), -(R - 1)), to: today(), unit: 'kg', label: 'Peso corporal', empty: 'Registra tu peso o sincroniza con Salud para ver la tendencia.' });
  const body = head + kp + chart + tableView(pts.map((p) => [fmtD(p.k, 'dmy'), fmt(p.y, 1) + ' kg']), ['Fecha', 'Peso']);
  return compact ? body : '<section class="card">' + body + '</section>';
}
function stepsBlock(R, compact) {
  const g = S.settings.stepGoal;
  let bars;
  if (R > 45) {
    bars = [];
    for (let w = Math.ceil(R / 7) - 1; w >= 0; w--) {
      const ws = addD(wkStart(today()), -7 * w);
      const vals = [];
      for (let i = 0; i < 7; i++) { const h = hday(addD(ws, i)); if (h && h.steps) vals.push(h.steps); }
      bars.push({ k: ws, y: Math.round(avg(vals)), lbl: 'Semana del ' + fmtD(ws, 'dm') + ' (media)', tick: fmtD(ws, 'dm') });
    }
  } else bars = daysBack(R).map((k) => ({ k, y: (hday(k) || {}).steps || 0 }));
  const withData = bars.filter((b) => b.y > 0);
  const head = compact ? '' : '<div class="card-h"><div><p class="eyebrow">Pasos ' + (R > 45 ? '· media semanal' : 'diarios') + '</p><h3>' + (withData.length ? fmt(avg(withData.map((b) => b.y))) + ' de media' : 'Sin datos') + '</h3></div><span class="muted small">Objetivo ' + fmt(g) + '</span></div>';
  const body = head + barChart({ bars, goal: g, hitGoal: true, unit: 'pasos', label: 'Pasos', empty: 'Sincroniza con Apple Salud para ver tus pasos (los mismos que cuenta StepsApp).' }) +
    tableView(withData.map((b) => [b.lbl || fmtD(b.k, 'dmy'), fmt(b.y)]), ['Día', 'Pasos']);
  return compact ? body : '<section class="card">' + body + '</section>';
}
function kcalBlock(R) {
  const T = targets(), n = Math.min(R, 60);
  const bars = daysBack(n).map((k) => { const t = dayTotals(k); return { k, y: Math.round(t.kcal), dim: t.src === 'salud' }; });
  const withData = bars.filter((b) => b.y > 0);
  return '<section class="card"><div class="card-h"><div><p class="eyebrow">Calorías consumidas' + (R > 60 ? ' · últimos 60 días' : '') + '</p><h3>' + (withData.length ? fmt(avg(withData.map((b) => b.y))) + ' kcal de media' : 'Sin registros') + '</h3></div><span class="muted small">Objetivo ' + fmt(T.kcal) + '</span></div>' +
    barChart({ bars, goal: T.kcal, unit: 'kcal', label: 'Calorías por día', empty: 'Registra comidas para ver tu media frente al objetivo.' }) +
    (bars.some((b) => b.dim) ? '<p class="srcnote">' + ic('info', 'sm') + 'Las barras más oscuras vienen de Apple Salud (Fastic).</p>' : '') +
    tableView(withData.map((b) => [fmtD(b.k, 'dmy'), fmt(b.y) + ' kcal']), ['Día', 'Kcal']) + '</section>';
}
function protBlock(R) {
  const T = targets(), n = Math.min(R, 60);
  const bars = daysBack(n).map((k) => ({ k, y: Math.round(dayTotals(k).p) }));
  const withData = bars.filter((b) => b.y > 0);
  return '<section class="card"><div class="card-h"><div><p class="eyebrow">Proteína</p><h3>' + (withData.length ? fmt(avg(withData.map((b) => b.y))) + ' g de media' : 'Sin registros') + '</h3></div><span class="muted small">Objetivo ' + T.p + ' g</span></div>' +
    barChart({ bars, goal: T.p, hitGoal: true, unit: 'g', label: 'Proteína por día', empty: 'Aún no hay comidas registradas.' }) +
    tableView(withData.map((b) => [fmtD(b.k, 'dmy'), b.y + ' g']), ['Día', 'Proteína']) + '</section>';
}
function trainBlock() {
  const weeks = 12, bars = [], need = sched().filter(Boolean).length;
  for (let w = weeks - 1; w >= 0; w--) {
    const ws = addD(wkStart(today()), -7 * w), W = weekInfo(ws);
    bars.push({ k: ws, y: W.done, lbl: 'Semana del ' + fmtD(ws, 'dm'), tick: fmtD(ws, 'dm') });
  }
  const A = adherence(4);
  return '<section class="card"><div class="card-h"><div><p class="eyebrow">Entrenos por semana</p><h3>' + (A.pct == null ? 'Empieza a registrar' : fmt(A.pct * 100) + ' % de asistencia') + '</h3></div><span class="muted small">Plan: ' + (need || '—') + '/semana</span></div>' +
    barChart({ bars, goal: need || null, hitGoal: true, unit: 'entrenos', label: 'Entrenos por semana', empty: 'Tus semanas de entreno aparecerán aquí.' }) + '</section>';
}
function strengthBlock() {
  const H = idx().hist, rows = [];
  Object.keys(H).forEach((k) => {
    const h = H[k];
    if (h.length < 2 || !h[0].ex || h[0].ex.type !== 'reps') return;
    rows.push({ k, n: h[0].ex.name, cnt: h.length, v: h.slice(0, 12).reverse().map((x) => bestE1(x.sets)) });
  });
  rows.sort((a, b) => b.cnt - a.cnt);
  if (!rows.length) return '<section class="card"><h3>Fuerza</h3><p class="muted">Con dos entrenos del mismo ejercicio verás aquí cómo sube tu 1RM estimado.</p></section>';
  return '<section class="card"><div class="card-h"><div><p class="eyebrow">Fuerza · 1RM estimado</p><h3>Tus ejercicios principales</h3></div></div>' +
    rows.slice(0, 6).map((r) => {
      const a = r.v[0], b = r.v[r.v.length - 1], ch = a ? ((b - a) / a) * 100 : 0;
      return '<button class="exp" data-act="exChart" data-k="' + esc(r.k) + '" data-n="' + esc(r.n) + '"><span class="exp-n">' + esc(r.n) + '</span><span class="exp-r">' + spark(r.v) + '<span class="small ' + (ch > 0.5 ? 'trend-up' : ch < -0.5 ? 'trend-down' : 'trend-flat') + '">' + fmtSigned(ch, 0) + ' %</span></span><span class="exp-s">' + fmt(b, 1) + ' kg · ' + r.cnt + ' sesiones</span></button>';
    }).join('') + '</section>';
}

function buildTurns(hist) {
  const lead = COACH_RULES + '\n\n' + KNOWLEDGE + '\n\n' + coachContext() + '\n\n(Fin del contexto. Sigue la conversación con el usuario.)';
  const turns = [{ role: 'user', content: lead }];
  hist.filter((m) => m.content && !m.pending).slice(-12).forEach((m) => {
    let c = m.content;
    if (m.role === 'assistant' && m.acts && m.acts.length) c += '\n[Acciones propuestas: ' + m.acts.map((a) => actionLabel(a) + (a.st === 'applied' ? ' (aplicada)' : a.st === 'dismissed' ? ' (descartada)' : '')).join('; ') + ']';
    turns.push({ role: m.role === 'assistant' ? 'assistant' : 'user', content: c.slice(0, 8000) });
  });
  return turns;
}
async function coachSend(q) {
  q = String(q || '').trim();
  if (!q) return;
  if (!AI.ok()) { if (UI.tab !== 'coach') go('coach'); toast(AI_OFF); return; }
  if (UI.chatBusy) { toast('Espera a que termine la respuesta'); return; }
  if (!S.chat) S.chat = { messages: [] };
  const msgs = S.chat.messages;
  msgs.push({ role: 'user', content: q, t: Date.now() });
  const a = { role: 'assistant', content: '', t: Date.now(), pending: true };
  msgs.push(a);
  const ai = msgs.length - 1;
  UI.chatBusy = true;
  const ctl = new AbortController();
  UI.chatCtl = ctl;
  if (UI.tab !== 'coach') go('coach'); else renderChat();
  scrollChatEnd();
  const turns = buildTurns(msgs.slice(0, -1));
  const deep = /revisi[oó]n semanal|analiza|plan completo/i.test(q);
  try {
    const res = await AI.text(turns, {
      signal: ctl.signal, cache: false, modelTier: deep ? 'complex' : 'default',
      onText: (u) => { a.content = u.text; updateBubble(ai); },
    });
    a.content = res.text;
    if (res.truncated) a.note = 'La respuesta se cortó. Pide menos cosas a la vez.';
  } catch (e) {
    if (e && e.code === 'refused') a.content = '';
    else if (e && e.text) a.content = e.text;
    const m = AI.msg(e);
    if (m) a.err = m;
    if (e && e.code === 'cancelled' && !a.content) a.content = '(Detenido)';
  } finally {
    const sp = splitActions(a.content);
    a.content = sp.text;
    a.acts = sp.acts.map((x) => Object.assign({}, x, { st: null }));
    delete a.pending;
    if (!a.content && !a.err) a.err = 'No ha llegado respuesta.';
    UI.chatBusy = false;
    UI.chatCtl = null;
    S.chat.messages = msgs.filter((m) => m.content || m.err).slice(-40).map((m) => Object.assign({}, m, { content: String(m.content || '').slice(0, 6000) }));
    Store.save('chat/main', S.chat);
    renderChat();
    scrollChatEnd();
  }
}

  return '<section class="wk-ex' + (done ? ' is-done' : '') + '" id="wkx-' + i + '"><div class="wk-ex-h"><div><h3>' + esc(e.name) + '</h3><p class="muted small">' + liveTarget(e) + (e.rest && !isC ? ' · descanso ' + fmtRest(e.rest) : '') + '</p></div><button class="icon-btn" data-act="wkExMenu" data-e="' + i + '" aria-label="Opciones de ' + esc(e.name) + '">' + ic('more') + '</button></div>' +
    (e.prev ? '<p class="wk-prev">Anterior: <b>' + esc(fmtSets(e.prev, e.type)) + '</b></p>' : '') +
    (e.why ? '<p class="wk-why' + (e.up ? ' up' : e.down ? ' down' : '') + '">' + (e.up ? ic('up') : e.down ? ic('down') : ic('info')) + '<span>' + esc(e.why) + '</span></p>' : '') +
    '<div class="sets"><div class="set-h"><span style="text-align:center">Serie</span><span style="text-align:center">' + (isC ? '' : isT ? 'Lastre' : 'Peso') + '</span><span style="text-align:center">' + (isC ? 'Minutos' : isT ? 'Segundos' : 'Reps') + '</span><span></span></div>' +
    e.sets.map((s, j) => {
      const wTxt = isC ? '<span class="muted">—</span>' : s.w == null ? '<span class="muted">kg</span>' : (+s.w === 0 && (e.inc === 0 || isT) ? '<span class="muted">Corporal</span>' : fmtKg(s.w) + ' <small>kg</small>');
      return '<div class="set' + (s.done ? ' done' : '') + '"><span class="set-n">' + (j + 1) + '</span><button class="set-w" data-act="wkSet" data-e="' + i + '" data-s="' + j + '" data-f="w" aria-label="Peso serie ' + (j + 1) + '"' + (isC ? ' disabled' : '') + '>' + wTxt + '</button>' +
        '<button class="set-r" data-act="wkSet" data-e="' + i + '" data-s="' + j + '" aria-label="Repeticiones serie ' + (j + 1) + '">' + (s.r != null ? '<b>' + s.r + '</b>' : '<span class="ph">' + phReps(e, j) + '</span>') + '</button><span class="set-ok">' + (s.done ? ic('check') : '') + '</span></div>';
    }).join('') + '</div>' +
    '<div class="wk-ex-f"><button class="link" data-act="wkAddSet" data-e="' + i + '">' + ic('plus') + 'Serie</button>' + (e.sets.length > 1 ? '<button class="link" data-act="wkDelSet" data-e="' + i + '">Quitar serie</button>' : '') + '<button class="link" data-act="wkNote" data-e="' + i + '">' + (e.note ? 'Nota ✓' : 'Nota') + '</button></div></section>';
}
function renderWorkout() {
  const L = S.live, box = $('#workout');
  if (!L) { box.hidden = true; return; }
  const sc = box.scrollTop;
  const done = sum(L.ex, (e) => e.sets.filter((s) => s.done).length), all = sum(L.ex, (e) => e.sets.length);
  box.innerHTML = '<div class="wk-wrap"><header class="wk-top"><button class="icon-btn" data-act="wkMin" aria-label="Minimizar">' + ic('down') + '</button><div class="wk-title"><b>' + esc(L.dayName) + '</b><span class="muted small num"><span id="wkClock">' + fmtClock(Date.now() - L.start) + '</span> · ' + done + '/' + all + ' series' + (L.date !== today() ? ' · ' + esc(fmtD(L.date, 'dm')) : '') + '</span></div><button class="btn btn-primary btn-sm" data-act="wkFinish">Terminar</button></header>' +
    '<div class="wk-prog"><i style="width:' + (all ? (done / all) * 100 : 0) + '%"></i></div><div class="wk-body">' + L.ex.map(wkExCard).join('') +
    '<button class="btn btn-ghost wide" data-act="wkAddEx">' + ic('plus') + 'Añadir ejercicio</button><button class="btn btn-ghost wide danger-t" data-act="wkDiscard">Descartar entreno</button></div></div>' +
    '<div class="restbar" id="restbar" hidden></div>';
  box.scrollTop = sc;
  updateRest(true);
}
function wkTick() {
  if (!S.live) return;
  const c = $('#wkClock');
  if (c) c.textContent = fmtClock(Date.now() - S.live.start);
  updateRest(false);
}

/* ---------- registrar una serie: solo las repeticiones ---------- */
function repChips(e) {
  if (e.type === 'cardio') return [5, 10, 15, 20, 25, 30, 40, 45, 60, 75];
  if (e.type === 'time') return [15, 20, 30, 40, 45, 60, 75, 90, 120, 150];
  const lo = Math.max(1, e.repMin - 3), hi = Math.max(lo + 9, e.repMax + 3), out = [];
  for (let r = lo; r <= hi && out.length < 15; r++) out.push(r);
  return out;
}
ACT.wkSet = (el) => openRepSheet(+el.dataset.e, +el.dataset.s, el.dataset.f === 'w');
function openRepSheet(i, j, focusW) {
  const e = S.live.ex[i], s = e.sets[j];
  const isC = e.type === 'cardio';
  let w = s.w;
  if (w == null) for (let k = j - 1; k >= 0; k--) if (e.sets[k].w != null) { w = e.sets[k].w; break; }
  const inc = e.inc > 0 ? +e.inc : 2.5;
  const prevR = e.prev && e.prev[j] ? e.prev[j].r : null;
  const unit = isC ? 'minutos' : e.type === 'time' ? 'segundos' : 'repeticiones';
  const sh = sheet('<p class="muted small">Objetivo ' + liveTarget(e) + (prevR != null ? ' · la última vez: ' + prevR : '') + '</p>' +
    (isC ? '' : '<div class="wstep"><button class="icon-btn lg" data-act="wAdj" data-d="-1" aria-label="Menos peso">−</button><div class="wstep-v"><input id="wIn" type="text" inputmode="decimal" value="' + (w == null ? '' : String(w).replace('.', ',')) + '" placeholder="0" aria-label="Peso en kg"><span>kg</span></div><button class="icon-btn lg" data-act="wAdj" data-d="1" aria-label="Más peso">+</button></div>') +
    '<p class="eyebrow">Toca las ' + unit + '</p><div class="repgrid">' + repChips(e).map((r) => '<button class="rep' + (r >= e.repMin && r <= e.repMax && !isC ? ' in' : '') + (r === prevR ? ' prev' : '') + (s.r === r ? ' on' : '') + '" data-act="repPick" data-r="' + r + '">' + r + '</button>').join('') + '</div>' +
    '<form class="rep-other" data-submit="repSave"><input id="rIn" type="text" inputmode="numeric" placeholder="Otra cantidad" aria-label="' + unit + '"><button class="btn" type="submit">Guardar</button></form>' +
    (s.done ? '<button class="btn btn-ghost wide danger-t" data-act="repClear">Borrar esta serie</button>' : ''), { title: e.name + ' · serie ' + (j + 1) });
  UI.rep = { i, j, inc, sh };
  if (focusW) setTimeout(() => { const x = $('#wIn', sh.el); if (x) x.select(); }, 280);
}
ACT.wAdj = (el) => {
  const x = $('#wIn');
  if (!x) return;
  const v = num(x.value, 0), nv = Math.max(0, rnd(v + +el.dataset.d * UI.rep.inc, 2));
  x.value = String(nv).replace('.', ',');
};
ACT.repPick = (el) => saveRep(+el.dataset.r);
ACT.repSave = () => {
  const v = parseInt(String(($('#rIn') || {}).value || '').trim(), 10);
  if (!(v > 0)) { toast('Escribe un número'); return; }
  saveRep(v);
};
ACT.repClear = () => {
  const r = UI.rep, s = S.live.ex[r.i].sets[r.j];
  s.r = null; s.done = false;
  r.sh.close();
  saveLive();
  renderWorkout();
};
function isLastSet(i, j) {
  const L = S.live;
  for (let a = i; a < L.ex.length; a++) for (let b = a === i ? j + 1 : 0; b < L.ex[a].sets.length; b++) if (!L.ex[a].sets[b].done) return false;
  return true;
}
function saveRep(r) {
  const R = UI.rep, L = S.live, e = L.ex[R.i], s = e.sets[R.j];
  const wi = $('#wIn');
  let w = e.type === 'cardio' ? 0 : wi && wi.value.trim() !== '' ? rnd(num(wi.value, 0), 2) : s.w;
  const was = s.done;
  s.w = w == null ? 0 : w;
  s.r = r; s.done = true; s.t = Date.now();
  for (let k = R.j + 1; k < e.sets.length; k++) if (!e.sets[k].done) e.sets[k].w = s.w;
  R.sh.close();
  if (!was && S.settings.autoRest && e.type !== 'cardio' && !isLastSet(R.i, R.j)) {
    const sec = +e.rest || S.settings.restSec;
    L.rest = { until: Date.now() + sec * 1000, total: sec };
  }
  saveLive();
  renderWorkout();
  if (e.sets.every((x) => x.done)) {
    const nx = $('#wkx-' + (R.i + 1));
    if (nx) setTimeout(() => nx.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
  }
}

/* ---------- temporizador de descanso ---------- */
function updateRest(force) {
  const bar = $('#restbar'), L = S.live;
  if (!bar || !L) return;
  const R = L.rest;
  if (!R) { bar.hidden = true; bar.dataset.st = ''; return; }
  const left = R.until - Date.now();
  if (left <= -6000) { L.rest = null; bar.hidden = true; bar.dataset.st = ''; saveLive(); return; }
  bar.hidden = false;
  if (left <= 0) {
    if (bar.dataset.st !== 'go' || force) {
      bar.dataset.st = 'go';
      bar.className = 'restbar go';
      bar.innerHTML = '<b>¡A por la siguiente serie!</b><button class="btn btn-sm" data-act="wkRestSkip">Vale</button>';
      if (!R.beeped) { R.beeped = true; beep(); }
    }
    return;
  }
  if (bar.dataset.st !== 'run' || force) {
    bar.dataset.st = 'run';
    bar.className = 'restbar';
    bar.innerHTML = '<div class="rb-fill"></div><button class="rb-b" data-act="wkRestAdj" data-d="-15" aria-label="Quitar 15 segundos">−15</button><div class="rb-c"><span class="muted small">Descanso</span><b class="rb-t"></b></div><button class="rb-b" data-act="wkRestAdj" data-d="15" aria-label="Añadir 15 segundos">+15</button><button class="rb-b" data-act="wkRestSkip">Saltar</button>';
  }
  const t = bar.querySelector('.rb-t'), f = bar.querySelector('.rb-fill');
  if (t) t.textContent = fmtClock(left + 999);
  if (f) f.style.width = ((1 - left / (R.total * 1000)) * 100).toFixed(1) + '%';
}
ACT.wkRestAdj = (el) => {
  const R = S.live && S.live.rest;
  if (!R) return;
  const d = +el.dataset.d * 1000;
  R.until = Math.max(Date.now() + 1000, R.until + d);
  R.total = Math.max(5, R.total + d / 1000);
  saveLive();
  updateRest(false);
};
ACT.wkRestSkip = () => { if (S.live) { S.live.rest = null; saveLive(); updateRest(true); } };

/* ---------- editar el entreno en curso ---------- */
ACT.wkAddSet = (el) => {
  const e = S.live.ex[+el.dataset.e], last = e.sets[e.sets.length - 1];
  e.sets.push({ w: last ? last.w : null, r: null, done: false });
  saveLive();
  renderWorkout();
};
ACT.wkDelSet = (el) => {
  const e = S.live.ex[+el.dataset.e];
  if (e.sets.length <= 1) return;
  let k = -1;
  for (let x = e.sets.length - 1; x >= 0; x--) if (!e.sets[x].done) { k = x; break; }
  e.sets.splice(k >= 0 ? k : e.sets.length - 1, 1);
  saveLive();
  renderWorkout();
};
ACT.wkNote = (el) => {
  const i = +el.dataset.e, e = S.live.ex[i];
  UI.noteI = i;
  sheet('<form class="form" data-submit="wkNoteSave"><label class="field"><span>Nota</span><input id="wkNoteIn" type="text" value="' + esc(e.note || '') + '" placeholder="Molestia, técnica, ajuste de la máquina…" maxlength="160"></label><button class="btn btn-primary" type="submit">Guardar</button></form>', { title: e.name });
};
ACT.wkNoteSave = () => {
  S.live.ex[UI.noteI].note = (($('#wkNoteIn') || {}).value || '').trim();
  saveLive();
  closeAllSheets();
  renderWorkout();
};
ACT.wkExMenu = (el) => {
  const i = +el.dataset.e, e = S.live.ex[i];
  UI.wkEx = i;
  sheet('<div class="form"><button class="btn" data-act="wkSwap">' + ic('swap') + 'Cambiar por otro ejercicio (máquina ocupada)</button>' +
    (i > 0 ? '<button class="btn" data-act="wkMove" data-d="-1">' + ic('up') + 'Subir</button>' : '') + (i < S.live.ex.length - 1 ? '<button class="btn" data-act="wkMove" data-d="1">' + ic('down') + 'Bajar</button>' : '') +
    '<button class="btn btn-danger" data-act="wkRemove">' + ic('trash') + 'Quitar de este entreno</button></div>', { title: e.name });
};
ACT.wkMove = (el) => {
  const i = UI.wkEx, j = i + +el.dataset.d, a = S.live.ex;
  if (j < 0 || j >= a.length) return;
  const x = a[i]; a[i] = a[j]; a[j] = x;
  saveLive();
  closeAllSheets();
  renderWorkout();
};
ACT.wkRemove = () => {
  S.live.ex.splice(UI.wkEx, 1);
  saveLive();
  closeAllSheets();
  renderWorkout();
};
ACT.wkSwap = () => {
  const i = UI.wkEx, old = S.live.ex[i];
  closeAllSheets();
  pickExercise((def) => {
    const nx = liveEx(makeEx(Object.assign({}, def, { sets: old.sets.length, repMin: old.repMin, repMax: old.repMax, rest: old.rest })));
    old.sets.forEach((s, k) => { if (s.done && nx.sets[k]) nx.sets[k] = Object.assign({}, s); });
    S.live.ex.splice(i, 1, nx);
    saveLive();
    renderWorkout();
  }, 'Cambiar ' + old.name);
};
ACT.wkAddEx = () => pickExercise((def) => {
  S.live.ex.push(liveEx(makeEx(def)));
  saveLive();
  renderWorkout();
  setTimeout(() => { const n = $('#wkx-' + (S.live.ex.length - 1)); if (n) n.scrollIntoView({ behavior: 'smooth' }); }, 100);
});
ACT.wkDiscard = async () => {
  if (!(await confirmBox('¿Descartar este entreno?', { yes: 'Descartar', danger: true, detail: 'No se guardará nada de esta sesión.' }))) return;
  S.live = null;
  Store.remove('live/session');
  closeWorkoutView();
};

/* ---------- terminar ---------- */
ACT.wkFinish = async () => {
  const L = S.live;
  const doneN = sum(L.ex, (e) => e.sets.filter((s) => s.done && s.r > 0).length);
  if (!doneN) {
    if (await confirmBox('No has registrado ninguna serie. ¿Descartar el entreno?', { yes: 'Descartar', danger: true })) { S.live = null; Store.remove('live/session'); closeWorkoutView(); }
    return;
  }
  const pend = sum(L.ex, (e) => e.sets.filter((s) => !s.done).length);
  const vol = Math.round(sum(L.ex, (e) => (e.type === 'reps' ? sum(e.sets.filter((s) => s.done), (s) => (+s.w || 0) * s.r) : 0)));
  UI.feel = null;
  sheet('<div class="kpis"><div class="kpi"><b>' + fmtMin((Date.now() - L.start) / 60000) + '</b><span>Duración</span></div><div class="kpi"><b>' + doneN + '</b><span>Series</span></div><div class="kpi"><b>Σ ' + fmt(vol) + '</b><span>kg movidos</span></div></div>' +
    (pend ? '<p class="muted small">' + pend + ' ' + plural(pend, 'serie sin hacer no se guardará', 'series sin hacer no se guardarán') + '.</p>' : '') +
    '<div class="field"><span>¿Cómo te has sentido?</span><div class="chips" id="feelChips">' + FEELS.map((f) => '<button class="chip" data-act="pickFeel" data-f="' + f[0] + '">' + f[1] + '</button>').join('') + '</div></div>' +
    '<label class="field"><span>Nota (opcional)</span><input id="finNote" type="text" placeholder="Sueño, energía, molestias…" maxlength="200"></label>' +
    '<button class="btn btn-primary wide btn-lg" data-act="wkSave">' + ic('check') + 'Guardar entreno</button>', { title: 'Terminar entreno' });
};
ACT.pickFeel = (el) => { UI.feel = el.dataset.f; $$('#feelChips .chip').forEach((c) => c.classList.toggle('on', c === el)); };
ACT.wkSave = () => {
  const L = S.live, end = Date.now();
  const ex = L.ex.map((e) => ({ id: e.src || e.id, lib: e.lib, name: e.name, p: e.p, s: e.s, repMin: e.repMin, repMax: e.repMax, type: e.type, sets: e.sets.filter((s) => s.done && s.r > 0).map((s) => ({ w: s.w == null ? 0 : s.w, r: s.r })), note: e.note || '' })).filter((e) => e.sets.length);
  const rec = {
    id: L.id, date: L.date, start: L.start, end, dur: Math.max(1, Math.round((end - L.start) / 60000)), dayId: L.dayId, dayName: L.dayName, short: !!L.short,
    ex, vol: Math.round(sum(ex, (e) => (e.type === 'reps' ? sum(e.sets, (s) => (+s.w || 0) * s.r) : 0))), prs: computePRs(ex), feel: UI.feel || null, note: (($('#finNote') || {}).value || '').trim(),
  };
  S.sessions.unshift(rec);
  bump();
  Store.save('sessions/' + rec.id, rec, 0);
  if (calOv(rec.date) && calOv(rec.date).st === 'skip') setCalOv(rec.date, null);
  S.live = null;
  Store.remove('live/session');
  closeAllSheets();
  closeWorkoutView();
  UI.tab = 'hoy';
  render();
  const pr = rec.prs.length;
  sheet('<div class="kpis"><div class="kpi"><b>' + fmtMin(rec.dur) + '</b><span>Duración</span></div><div class="kpi"><b>' + countSets(rec) + '</b><span>Series</span></div><div class="kpi"><b>Σ ' + fmt(rec.vol) + '</b><span>kg</span></div></div>' +
    (pr ? '<div class="ins lvl-good" style="border:0;padding:0"><div class="ins-i">' + ic('trophy') + '</div><b>' + pr + ' ' + plural(pr, 'récord nuevo', 'récords nuevos') + '</b><p>' + rec.prs.map((p) => esc(p.name) + ': ' + fmtKg(p.w) + ' kg × ' + p.r).join('<br>') + '</p></div>' : '<p class="fg2">Sesión guardada. La próxima vez verás aquí tus sugerencias de peso.</p>') +
    (upcoming(1)[0] ? '<p class="muted">Próximo: ' + esc(relD(upcoming(1)[0].k).toLowerCase()) + ' · ' + esc(upcoming(1)[0].day.name) + '</p>' : '') +
    '<div class="btn-row"><button class="btn" data-act="sheetClose">Cerrar</button>' + (AI.ok() ? '<button class="btn btn-primary" data-act="coachAsk" data-q="Analiza el entreno que acabo de terminar (' + esc(rec.dayName) + ') y dime qué mejorar la próxima vez.">' + ic('sparkle') + 'Análisis del coach</button>' : '') + '</div>', { title: '¡Buen entreno!' });
};

// ---- 99-main.js ----
/* ============ Enten · arranque ============ */
async function loadAll() {
  const paths = ['profile/main', 'settings/main', 'routine/main', 'live/session', 'fasting/main', 'chat/main', 'foods/custom'];
  const v = await Promise.all(paths.map((p) => Store.get(p)));
  S.profile = v[0];
  S.settings = Object.assign(clone(DEF_SETTINGS), v[1] || {});
  S.settings.targets = Object.assign({ mode: 'auto' }, S.settings.targets || {});
  S.routine = normRoutine(v[2]);
  S.live = v[3] && Array.isArray(v[3].ex) ? v[3] : null;
  S.fasting = v[4];
  S.chat = v[5] && Array.isArray(v[5].messages) ? v[5] : null;
  S.myfoods = v[6] && Array.isArray(v[6].items) ? v[6] : null;
  const from = addD(today(), -130);
  const r = await Promise.all([
    Store.list('sessions', { orderBy: 'date', dir: 'desc', limit: 800 }),
    Store.list('food', { where: ['date', '>=', from] }),
    Store.list('health'),
    Store.list('calendar'),
  ]);
  S.sessions = r[0].map((x) => x.data).filter((x) => x && x.date && Array.isArray(x.ex));
  S.food = {};
  r[1].forEach((x) => { if (x.data && x.data.date) S.food[x.data.date] = x.data; });
  S.health = {};
  r[2].forEach((x) => { if (x.data && x.data.month && x.data.days) S.health[x.data.month] = x.data; });
  S.cal = {};
  r[3].forEach((x) => { if (x.data && x.data.month && x.data.days) S.cal[x.data.month] = x.data; });
  bump();
  S.loaded = true;
}

async function refreshFromStore() {
  if (Store.mode !== 'cloud' || Store.pend.size || (S.live && !$('#workout').hidden) || SHEETS.length) return;
  try { await loadAll(); render(); } catch (e) { console.warn(e); }
}
let lastRefresh = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!S.profile) return;
  if (Date.now() - lastRefresh > 60000) { lastRefresh = Date.now(); refreshFromStore(); }
  else if (S.loaded && !SHEETS.length && !(S.live && !$('#workout').hidden)) render();
});

async function boot(hot) {
  try {
    await Promise.all([Store.init(), AI.init()]);
    await loadAll();
  } catch (e) {
    console.error(e);
    S.settings = S.settings || clone(DEF_SETTINGS);
    S.loaded = true;
  }
  try { const t = (hot && hot.tab) || sessionStorage.getItem('enten:tab'); if (t && VIEWS[t]) UI.tab = t; } catch (e) {}
  if (hot && hot.seg) UI.seg = hot.seg;
  render();
  if (S.live && hot && hot.wk) openWorkout();
  if (Store.inClaude && !Store.owner) toast('Estás viendo la app de otra persona: tus datos se guardan solo en este navegador.', { ms: 6000 });
  setInterval(() => {
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (S.loaded && S.profile && UI.tab === 'hoy' && !SHEETS.length && !typing && document.visibilityState === 'visible' && !(S.live && !$('#workout').hidden)) render();
  }, 60000);
}

try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ tab: UI.tab, seg: UI.seg, wk: !!(S.live && !$('#workout').hidden) }));
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
} catch (e) { boot({}); }

</script>
