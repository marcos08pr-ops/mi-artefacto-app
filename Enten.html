<title>Enten</title>
<link rel="apple-touch-icon" sizes="1024x1024" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="1024x1024" href="apple-touch-icon.png">

      var l = document.createElement('link'); l.rel = x[0]; l.href = url; l.setAttribute('sizes', '1024x1024'); if (x[1]) l.type = x[1]; h.appendChild(l);

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<style>
:root{
  color-scheme:dark;
  /* Layout: una sola columna de móvil (máx. 540px) con tarjetas densas en datos sobre negro violáceo; filas separadas por líneas finas al estilo Cronometer; barra de pestañas fija abajo */
  --bg:#08070c;
  --surface:#13111a;
  --surface-2:#1a1723;
  --surface-3:#242030;
  --line:#28233a;
  --line-2:#3a3350;
  --fg:#efecf6;
  --fg-2:#bcb6cb;
  --fg-3:#8b859d;
  --accent:#9d7dff;
  --accent-hi:#c4b1ff;
  --accent-lo:#6a43ee;
  --accent-wash:rgba(157,125,255,.14);
  --accent-track:#2a2342;
  --accent-ink:#0e0919;
  --prot:#199e70; --prot-track:#12302a;
  --carb:#3987e5; --carb-track:#15263f;
  --fat:#d95926;  --fat-track:#3a1f16;
  --fib:#8b859d;  --fib-track:#26232f;
  --water:#3987e5; --water-track:#15263f;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:9px;
  --tabh:62px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;font-stretch:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-stretch:116%;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:750;line-height:1.1}
h2{font-size:21px;font-weight:720;line-height:1.15}
h3{font-size:16px;font-weight:680;line-height:1.2}
small,.small{font-size:12.5px}
.muted{color:var(--fg-3)}
.fg2{color:var(--fg-2)}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;opacity:0}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-stretch:112%}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}

/* ---------- marco ---------- */
#app{max-width:540px;margin:0 auto;padding:0 16px calc(var(--tabh) + 36px + env(safe-area-inset-bottom,0px));position:relative}
#app::before{content:"";position:absolute;left:0;right:0;top:-40px;height:320px;background:radial-gradient(80% 70% at 50% 0%,rgba(122,84,255,.22),transparent 70%);pointer-events:none;z-index:-1}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 8px;background:linear-gradient(var(--bg) 62%,rgba(8,7,12,0))}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:block;border-radius:24%;box-shadow:0 0 0 1px var(--line)}
.wordmark{font-size:19px;font-weight:780;font-stretch:125%;letter-spacing:.02em}
.top-r{display:flex;align-items:center;gap:4px}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:12px;color:var(--fg-2)}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.lg{width:52px;height:52px;font-size:26px;font-weight:600;background:var(--surface-3);color:var(--fg)}
.sync{width:30px;height:30px;display:inline-grid;place-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.saving i{background:var(--warn)}
.sync.offline i,.sync.error i{background:var(--crit)}
.sync.local i{background:var(--fg-3)}
#view{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.page-h{padding:6px 2px 2px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hello{padding:8px 2px 4px;display:flex;flex-direction:column;gap:4px}

/* ---------- pestañas ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(13,11,19,.88);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-top:1px solid var(--line)}
.tabbar-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg-3);font-size:11px;font-weight:600;letter-spacing:.01em}
.tab .ic{width:24px;height:24px}
.tab.on{color:var(--accent-hi)}
.tab.on .ic{stroke-width:2.1}

/* ---------- tarjetas y filas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.card-h > div{min-width:0;display:flex;flex-direction:column;gap:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.link{color:var(--accent-hi);font-weight:620;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.link .ic{width:16px;height:16px}
.list-h{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);padding:10px 0 2px;font-stretch:112%}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty p{color:var(--fg-3);max-width:34ch}
.lead{font-size:16.5px;line-height:1.45}
.ok-line{display:flex;gap:8px;align-items:center;color:var(--fg-2)}
.ok-line .ic{color:var(--good)}
hr.sep{border:0;border-top:1px solid var(--line);margin:2px 0}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--r-md);background:var(--surface-3);color:var(--fg);font-weight:640;font-size:15px;line-height:1.1;white-space:nowrap}
.btn .ic{width:19px;height:19px}
.btn:active{filter:brightness(1.15)}
.btn-primary{background:linear-gradient(180deg,#a98bff,#8a66ff);color:var(--accent-ink);box-shadow:0 6px 22px -8px rgba(140,100,255,.6)}
.btn-ghost{background:transparent;color:var(--accent-hi);border:1px solid var(--line-2)}
.btn-danger{background:#3a1518;color:#ffb4b4;border:1px solid #5a2228}
.btn-sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn-lg{min-height:52px;padding:12px 20px;font-size:16px}
.btn.wide{width:100%}
.danger-t{color:#ff9d9d}
.btn-row{display:flex;gap:10px;align-items:center}
.btn-row > .btn{flex:1}
.btn-row.wrap{flex-wrap:wrap}
.btn-row.wrap > .btn{flex:1 1 auto}
.add-line{display:flex;align-items:center;gap:8px;color:var(--accent-hi);font-weight:620;font-size:14px;padding:4px 0}
.add-line .ic{width:18px;height:18px}

/* ---------- chips / segmentos ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:7px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2);font-size:14px;font-weight:560;white-space:nowrap}
.chip.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-hi)}
.chip .ic{width:16px;height:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}
.seg button{min-height:36px;border-radius:10px;font-size:13.5px;font-weight:620;color:var(--fg-3);text-align:center}
.seg button.on{background:var(--surface-3);color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:650;letter-spacing:.02em;background:var(--surface-3);color:var(--fg-2)}
.pill .ic{width:14px;height:14px}
.pill.sm{padding:2px 8px;font-size:11.5px}
.pill-accent{background:var(--accent-wash);color:var(--accent-hi)}
.pill-good{background:rgba(12,163,12,.16);color:#7fe07f}
.pill-warn{background:rgba(250,178,25,.14);color:#ffd27a}
.pill-serious{background:rgba(236,131,90,.16);color:#ffb796}
.pill-crit{background:rgba(208,59,59,.18);color:#ff9d9d}
.pill-live i{width:7px;height:7px;border-radius:50%;background:#ff5d6c;box-shadow:0 0 0 0 rgba(255,93,108,.6);animation:pulse 1.6s infinite}
.pill-live{background:rgba(255,93,108,.14);color:#ffadb5}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.55)}70%{box-shadow:0 0 0 7px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}
.dchip{width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-stretch:112%;color:var(--fg-3);text-align:center}
.dchip.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-hi)}
.days-pick{display:flex;gap:6px;justify-content:space-between}
.switch{width:50px;height:30px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg-2);transition:transform .2s}
.switch.on{background:var(--accent-lo);border-color:var(--accent)}
.switch.on::after{transform:translateX(20px);background:#fff}

/* ---------- héroe de entreno ---------- */
.hero{position:relative;border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:10px;background:
  radial-gradient(120% 120% at 100% 0%,rgba(157,125,255,.30),transparent 55%),
  linear-gradient(160deg,#1b1530,#121019 70%);border:1px solid #3b2f63;overflow:hidden}
.hero::after{content:"Σ";position:absolute;right:-6px;bottom:-34px;font-size:150px;font-weight:800;font-stretch:125%;color:rgba(196,177,255,.07);pointer-events:none;line-height:1}
.hero h2{font-size:24px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero-ex{color:var(--fg-2);font-size:14px}
.hero.rest,.hero.done{background:linear-gradient(160deg,#17141f,#121019);border-color:var(--line-2)}
.hero.live{border-color:#5b3f9e}

/* ---------- semana ---------- */
.wk-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;border-radius:12px;color:var(--fg-3)}
.wk-l{font-size:11px;font-weight:650;letter-spacing:.05em}
.wk-n{font-size:16px;font-weight:700;color:var(--fg-2);font-variant-numeric:tabular-nums}
.wk-dot{width:7px;height:7px;border-radius:50%;background:transparent}
.wk-d.is-today{background:var(--surface-3)}
.wk-d.is-today .wk-n{color:var(--fg)}
.st-done .wk-dot,.st-done i{background:var(--accent)}
.st-plan .wk-dot,.st-today .wk-dot,.st-plan i,.st-today i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.st-skip .wk-dot,.st-skip i{background:var(--warn)}
.st-miss .wk-dot,.st-miss i{background:var(--crit)}
.st-rest .wk-dot,.st-rest i{background:var(--line-2)}
.wk-note{font-size:13px;color:var(--fg-2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- energía (estilo Cronometer) ---------- */
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.rstat{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.rstat-w{position:relative;width:88px;height:88px}
.rstat-w svg{position:absolute;inset:0}
.rstat-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rstat-c b{font-size:17px;font-weight:720;line-height:1}
.rstat-c span{font-size:10.5px;color:var(--fg-3);margin-top:3px}
.rstat-l{font-size:12.5px;font-weight:620;color:var(--fg-2)}
.ring-t{fill:none;stroke:var(--surface-3)}
.ring-v{fill:none;stroke:var(--accent);transition:stroke-dasharray .5s}
.r-soft{stroke:#7d6cb0}
.r-over{stroke:var(--serious)}
.r-bmr{stroke:#5d5478}
.r-act{stroke:var(--accent-hi)}
.r-good{stroke:var(--good)}
.macros{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline}
.mrow-l{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.mrow-v{font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.mrow-v b{color:var(--fg);font-weight:680}
.mrow .meter{grid-column:1/-1}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-prot{background:var(--prot)} .d-carb{background:var(--carb)} .d-fat{background:var(--fat)} .d-fib{background:var(--fib)} .d-accent{background:var(--accent)}
.meter{height:8px;border-radius:999px;background:var(--accent-track);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);transition:width .5s}
.m-prot{background:var(--prot-track)} .m-prot i{background:var(--prot)}
.m-carb{background:var(--carb-track)} .m-carb i{background:var(--carb)}
.m-fat{background:var(--fat-track)} .m-fat i{background:var(--fat)}
.m-fib{background:var(--fib-track)} .m-fib i{background:var(--fib)}
.m-water{background:var(--water-track)} .m-water i{background:var(--water)}
.meter.over i{background:var(--serious)}
.split{display:flex;height:10px;gap:2px;border-radius:999px;overflow:hidden;background:var(--surface-3)}
.split i{display:block;height:100%}
.split i:first-child{border-radius:999px 0 0 999px}
.split i:last-child{border-radius:0 999px 999px 0}
.split-l{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--fg-2)}
.split-l span{display:inline-flex;gap:6px;align-items:center}
.srcnote{font-size:12.5px;color:var(--fg-3);display:flex;gap:6px;align-items:center}

/* ---------- mini tarjetas ---------- */
.mini{padding:14px;gap:8px;text-align:left;width:100%}
.mini-h{display:flex;align-items:center;gap:7px;color:var(--fg-2);font-size:13px;font-weight:640}
.mini-h .ic{width:18px;height:18px;color:var(--accent-hi)}
.mini-row{display:flex;align-items:center;gap:10px;min-width:0}
.mini-v{font-size:22px;font-weight:740;line-height:1.05}
.mini-u{font-size:12.5px;color:var(--fg-3)}
.mini-s{font-size:12.5px;color:var(--fg-3);min-height:1em}
.water-btns{display:flex;gap:6px}
.water-btns .btn{flex:1;min-height:36px;padding:6px 8px;font-size:13.5px}

/* ---------- insights ---------- */
.ins{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0;padding-top:2px}
.ins-i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-3);grid-row:span 3}
.ins-i .ic{width:18px;height:18px}
.ins.lvl-warn .ins-i{background:rgba(250,178,25,.13);color:#ffd27a}
.ins.lvl-alert .ins-i{background:rgba(208,59,59,.16);color:#ff9d9d}
.ins.lvl-good .ins-i{background:rgba(12,163,12,.15);color:#7fe07f}
.ins.lvl-info .ins-i{background:var(--accent-wash);color:var(--accent-hi)}
.ins b{font-size:14.5px}
.ins p{font-size:13.5px;color:var(--fg-2)}
.ins-a{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* ---------- rutina ---------- */
.day.is-next{border-color:#4a3a7e}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.exlist li:first-child{border-top:0;padding-top:0}
.exn{min-width:0}
.exs{color:var(--fg-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.day-f{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- calendario ---------- */
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-h span{font-size:11px;font-weight:650;color:var(--fg-3);letter-spacing:.05em}
.cal-c{aspect-ratio:1;max-width:100%;min-width:0;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:620;color:var(--fg-2);font-variant-numeric:tabular-nums}
.cal-c i{width:6px;height:6px;border-radius:50%;background:transparent}
.cal-c.is-today{background:var(--surface-3);color:var(--fg)}
.cal-c.st-done{background:var(--accent-wash);color:var(--accent-hi)}
.cal-c.empty{visibility:hidden}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-size:19px;font-weight:740;line-height:1.1}
.stat span{font-size:12px;color:var(--fg-3)}

/* ---------- historial ---------- */
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%}
.hrow > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hrow-r{align-items:flex-end;text-align:right}
.list .list-h + .hrow{border-top:0}

/* ---------- volumen ---------- */

const KNOWLEDGE = `BASE DE CONOCIMIENTO (evidencia 2014–2025; úsala, no la recites entera)
VOLUMEN
- Pelland et al. 2025 (Sports Medicine, 67 estudios): más series semanales = más hipertrofia y fuerza, con rendimientos decrecientes (mucho más marcados en fuerza). Se cuentan series fraccionadas: músculo principal 1, secundario 0,5.
- Volumen por sesión (Remmert/Pelland 2025): la hipertrofia deja de mostrar ventaja clara hacia ~11 series fraccionadas por músculo y sesión; la fuerza, hacia ~2 series directas. Si un músculo necesita más, se reparte en más días.
- Rango práctico: 10–20 series/semana en músculos grandes (RP: MEV ~6–10, MAV ~12–20, MRV ~20–26 según músculo). Mantener masa: ~1/3 del volumen habitual o ~4 series/semana.
FRECUENCIA
- Con el volumen igualado la frecuencia apenas cambia la hipertrofia; sirve para repartir volumen y ayuda a la fuerza. Si un músculo pasa de ~10 series/semana, mejor en 2 sesiones. 48–72 h entre sesiones duras del mismo músculo.
ESFUERZO
- Robinson et al. 2024: la hipertrofia mejora al acercarse al fallo; la fuerza depende poco de ello. La mayoría de series a 0–3 repeticiones en reserva (RIR); aislamientos y últimas series pueden ir al fallo; básicos pesados a 1–3 RIR.
- De ~5 a ~30 repeticiones se gana músculo parecido si se llega cerca del fallo; 6–15 es lo más eficiente en tiempo.
DESCANSO
- Singer et al. 2024: más de 60 s entre series da algo más de hipertrofia; por encima de 90 s no hay ventaja clara. Práctica: 2–3 min en básicos, 1–2 min en aislamientos.
SELECCIÓN DE EJERCICIOS
- Entrenar con el músculo estirado (longitud larga) tiende a dar más hipertrofia (metaanálisis 2025; Maeo 2021: curl femoral sentado > tumbado). Ejemplos: press con mancuernas, aperturas, jalón, curl inclinado, extensión de tríceps sobre la cabeza, peso muerto rumano, sentadilla profunda, búlgara.
- Buena relación estímulo/fatiga (Nippard, Israetel): máquinas y poleas estables para hipertrofia. 3 o más ejercicios casi idénticos para el mismo músculo en una sesión es redundante: más fatiga sin más estímulo. Mejor 1–2 ejercicios por músculo y sesión con ángulos distintos.
- Equilibrio: al menos tanto tirón como empuje; incluir isquios (bisagra y curl), deltoide lateral y posterior y gemelos.
PROGRESIÓN
- Doble progresión: al completar el tope del rango en todas las series, subir peso (~2–5 %); si no, sumar repeticiones. Sin progreso 3 sesiones seguidas: bajar ~10 % y reconstruir, cambiar el rango o la variante, o revisar sueño y comida.
- Descarga cada 4–8 semanas o cuando se acumula fatiga: misma carga, ~50 % de las series, 1 semana.
FALTAS Y PLANIFICACIÓN
- Perder una sesión no afecta. La pérdida medible de músculo empieza tras ~2–3 semanas sin entrenar y la fuerza tarda más; al volver se recupera rápido (memoria muscular: ciclos de 3 semanas sin entrenar y 6 de vuelta rinden casi igual que entrenar sin parar).
- Si falta un día: no duplicar la sesión siguiente. Mover la sesión al siguiente día libre y seguir la rotación (así no se salta ningún grupo). Si la semana se queda corta, hacer un full body condensado con los básicos pendientes o una versión exprés de 30–40 min.
- Si falta a menudo: un plan que tolere faltas (full body 3 días o torso/pierna 4) funciona mejor que un split de 5–6 días con cada músculo una vez por semana.
NUTRICIÓN
- Proteína: ~1,6 g/kg/día (Morton 2018), con margen hasta 2,2; en déficit 1,8–2,4 g/kg (Helms 2014). Repartir en 3–5 tomas de 0,4–0,55 g/kg.
- Perder grasa: 0,5–1 % del peso por semana conserva mejor el músculo (Helms 2014). Déficit ~15–25 %.
- Ganar músculo: +5–15 % de calorías (Iraki 2019), subir 0,25–0,5 % del peso por semana (principiantes algo más).
- Recomposición: mantenimiento o déficit leve con proteína alta; funciona mejor en principiantes o al volver tras un parón.
- Grasa mínima ~0,6–0,8 g/kg; carbohidratos para rendir en el gimnasio.
- Ayuno intermitente: útil si ayuda a cumplir las calorías; no es mejor que un déficit equivalente. En fase de ganar músculo, evitar ayunos largos que impidan llegar a la proteína; romper el ayuno con 30–50 g de proteína.
ACTIVIDAD Y RECUPERACIÓN
- 7.000–10.000 pasos/día se asocian a mejor salud; en definición, subir pasos ayuda al gasto sin interferir mucho con la fuerza.
- Sueño 7–9 h: dormir poco empeora la recuperación y hace que en déficit se pierda más músculo.
- Creatina monohidrato 3–5 g/día: el suplemento con mejor evidencia para fuerza e hipertrofia.
SEGURIDAD
- Dolor articular agudo, mareos, pitidos u hormigueos: parar y acudir a un profesional sanitario. Sin pautas médicas.`;

/* ============ Enten · almacenamiento ============
   En Claude: base de datos del artefacto (capacidad db), privada para el propietario.
   Fuera de Claude o si eres invitado: localStorage de este navegador.
   Las escrituras se agrupan por documento, van de una en una y se reintentan si no hay conexión. */
function cmpOp(a, op, b) {
  switch (op) {
    case '==': return a === b;
    case '!=': return a !== b;
    case '<': return a < b;
    case '<=': return a <= b;
    case '>': return a > b;
    case '>=': return a >= b;
    default: return true;
  }
}

const Store = {
  mode: 'local', db: null, user: null, owner: true, inClaude: false,
  pend: new Map(), busy: new Set(), status: 'ok', fails: 0, outbox: {},
  P: 'enten1:',

  async init() {
    const c = window.claude;
    this.inClaude = !!(c && typeof c.use === 'function');
    if (this.inClaude) {
      try {
        const res = await Promise.all([c.use('db'), c.use('user')]);
        const db = res[0], user = res[1];
        this.user = user || null;
        if (user) { try { this.owner = await user.isOwner(); } catch (e) { this.owner = true; } }
        if (db && this.owner !== false) { this.db = db; this.mode = 'cloud'; }
      } catch (e) { console.warn('db no disponible', e); }
    }
    try { const o = localStorage.getItem(this.P + '__outbox'); this.outbox = o ? JSON.parse(o) || {} : {}; } catch (e) { this.outbox = {}; }
    if (this.mode !== 'cloud') this.outbox = {};
    this.status = this.mode === 'cloud' ? 'ok' : 'local';
  },

  ls(path) { try { const v = localStorage.getItem(this.P + path); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  lsSet(path, data) {
    try { if (data == null) localStorage.removeItem(this.P + path); else localStorage.setItem(this.P + path, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  },
  lsKeys(prefix) {
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(this.P + prefix) === 0) out.push(k.slice(this.P.length)); } } catch (e) {}
    return out;
  },

  async get(path) {
    if (Object.prototype.hasOwnProperty.call(this.outbox, path)) { const v = this.outbox[path]; this.save(path, v, 50); return clone(v); }
    if (this.mode === 'cloud') {
      for (let i = 0; i < 2; i++) {
        try { const s = await this.db.doc(path).get(); return s.exists ? clone(s.data()) : null; }
        catch (e) {
          if (e && e.code === 'unavailable' && i === 0) { await sleep(400 + Math.random() * 600); continue; }
          console.warn('get', path, e); return null;
        }
      }
      return null;
    }
    return this.ls(path);
  },

  async list(coll, o) {
    o = o || {};
    let rows = [];
    if (this.mode === 'cloud') {
      for (let i = 0; i < 2; i++) {
        try {
          let q = this.db.collection(coll);
          if (o.where) q = q.where(o.where[0], o.where[1], o.where[2]);
          if (o.orderBy) q = q.orderBy(o.orderBy, o.dir || 'asc');
          if (o.limit) q = q.limit(o.limit);
          const snap = await q.get();
          rows = snap.docs.map((d) => ({ id: d.id, data: clone(d.data()) }));
          break;
        } catch (e) {
          if (e && e.code === 'unavailable' && i === 0) { await sleep(500 + Math.random() * 700); continue; }
          console.warn('list', coll, e); rows = []; break;
        }
      }
    } else {
      const pre = coll + '/';
      rows = this.lsKeys(pre).filter((p) => p.slice(pre.length).indexOf('/') < 0)
        .map((p) => ({ id: p.slice(pre.length), data: this.ls(p) })).filter((r) => r.data);
      if (o.where) rows = rows.filter((r) => cmpOp(r.data[o.where[0]], o.where[1], o.where[2]));
      if (o.orderBy) {
        const f = o.orderBy, dir = o.dir === 'desc' ? -1 : 1;
        rows.sort((a, b) => (a.data[f] > b.data[f] ? 1 : a.data[f] < b.data[f] ? -1 : 0) * dir);
      }
      if (o.limit) rows = rows.slice(0, o.limit);
    }
    // cambios pendientes de subir (sin conexión en la sesión anterior)
    const pre = coll + '/';
    Object.keys(this.outbox).forEach((p) => {
      if (p.indexOf(pre) !== 0 || p.slice(pre.length).indexOf('/') >= 0) return;
      const id = p.slice(pre.length), v = this.outbox[p];
      rows = rows.filter((r) => r.id !== id);
      if (v != null) rows.push({ id, data: clone(v) });
      this.save(p, v, 80);
    });
    return rows;
  },

  save(path, data, delay) {
    const p = this.pend.get(path) || {};
    clearTimeout(p.t);
    p.data = data === undefined ? null : clone(data);
    p.t = setTimeout(() => this.flushOne(path), delay == null ? 350 : delay);
    this.pend.set(path, p);
    this.setStatus('saving');
    this.persistOutbox();
  },
  remove(path) { this.save(path, null, 0); },

  async flushOne(path) {
    if (this.busy.has(path)) return;
    const p = this.pend.get(path);
    if (!p) return;
    clearTimeout(p.t);
    this.pend.delete(path);
    this.busy.add(path);
    let ok = true;
    try {
      if (this.mode === 'cloud') {
        if (p.data == null) await this.db.doc(path).delete();
        else await this.db.doc(path).set(p.data);
      } else if (!this.lsSet(path, p.data)) {
        throw { code: 'local_full' };
      }
      this.fails = 0;
      delete this.outbox[path];
    } catch (e) {
      ok = false;
      const code = (e && e.code) || 'unavailable';
      if (code === 'invalid_argument' || code === 'transform_error') {
        console.error('Escritura rechazada', path, e);
        delete this.outbox[path];
        toast('No se pudo guardar ' + path.split('/')[0] + '. Si se repite, exporta una copia en Ajustes.');
      } else if (code === 'quota_exceeded' || code === 'local_full') {
        toast('Almacenamiento lleno: exporta una copia y borra datos antiguos en Ajustes.');
      } else if (code === 'revoked' || code === 'not_granted') {
        this.setStatus('error');
      } else {
        this.fails++;
        if (!this.pend.has(path)) {
          const back = Math.min(30000, 1500 * Math.pow(2, Math.min(this.fails, 4)));
          this.pend.set(path, { data: p.data, t: setTimeout(() => this.flushOne(path), back) });
        }
      }
    } finally {
      this.busy.delete(path);
      if (ok && this.pend.has(path)) { const q = this.pend.get(path); clearTimeout(q.t); q.t = setTimeout(() => this.flushOne(path), 60); }
      this.persistOutbox();
      this.setStatus(this.pend.size ? (this.fails ? 'offline' : 'saving') : (this.mode === 'cloud' ? 'ok' : 'local'));
    }
  },

  async flushAll() { await Promise.all(Array.from(this.pend.keys()).map((p) => this.flushOne(p))); },

  persistOutbox() {
    if (this.mode !== 'cloud') return;
    try {
      const o = Object.assign({}, this.outbox);
      this.pend.forEach((v, k) => { o[k] = v.data; });
      this.outbox = o;
      if (Object.keys(o).length) localStorage.setItem(this.P + '__outbox', JSON.stringify(o));
      else localStorage.removeItem(this.P + '__outbox');
    } catch (e) {}
  },

  setStatus(s) {
    if (this.status === s) return;
    this.status = s;
    if (typeof renderSync === 'function') renderSync();
  },
};

window.addEventListener('online', () => { Store.fails = 0; Store.pend.forEach((v, k) => { clearTimeout(v.t); v.t = setTimeout(() => Store.flushOne(k), 100); }); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushAll(); });
window.addEventListener('pagehide', () => { Store.flushAll(); });

/* ============ Enten · IA ============
   Dentro de Claude: capacidad sample (sin clave).
   Fuera de Claude (Enten alojado en tu web, p. ej. GitHub Pages): API de Anthropic con tu propia clave,
   guardada solo en este navegador. El SDK oficial se carga bajo demanda desde jsDelivr. */
const API_KEY_LS = 'enten1:apiKey';
const API_MODEL = 'claude-opus-5-5';
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.132.1/+esm';
const AI_OFF = 'La IA funciona dentro de Claude o, fuera de Claude, con tu clave de API (Ajustes → IA sin Claude).';
const AI = {
  fn: null, lim: null, state: 'none', mode: null, // state: 'ready' | 'none' | 'denied' · mode: 'claude' | 'api'
  sdk: null, client: null,
  inClaude() { return !!(window.claude && typeof window.claude.use === 'function'); },
  getKey() { try { return localStorage.getItem(API_KEY_LS) || ''; } catch (e) { return ''; } },
  setKey(k) {
    try { if (k) localStorage.setItem(API_KEY_LS, k); else localStorage.removeItem(API_KEY_LS); } catch (e) { return false; }
    this.client = null;
    this.initApi();
    return true;
  },
  initApi() {
    if (this.mode === 'claude') return;
    if (this.getKey()) { this.mode = 'api'; this.state = 'ready'; }
    else { this.mode = null; this.state = 'none'; }
  },
  async init() {
    try { if (this.inClaude()) this.fn = await window.claude.use('sample'); } catch (e) { this.fn = null; }
    if (this.fn) {
      this.mode = 'claude';
      this.state = 'ready';
      try { this.lim = await this.fn.limits(); } catch (e) { this.lim = null; }
      return;
    }
    // Dentro de Claude la página no puede llamar a otros servidores, así que la clave solo sirve fuera.
    if (!this.inClaude()) this.initApi();
  },
  ok() { return this.state === 'ready'; },
  canImg() { return this.ok() && (this.mode === 'api' || !!(this.lim && this.lim.images)); },
  maxImg() { return this.mode === 'api' ? 4 : (this.lim && this.lim.images && this.lim.images.maxCount) || 1; },
  text(input, o) { return this.mode === 'api' ? this.apiText(input, o || {}) : this.fn(input, o || {}); },
  json(input, o) { return this.mode === 'api' ? this.apiJson(input, o || {}) : this.fn.json(input, o || {}); },

  async apiClient() {
    if (this.client) return this.client;
    if (!this.sdk) {
      try { this.sdk = await import(SDK_URL); } catch (e) { throw { code: 'sdk_load' }; }
    }
    this.client = new this.sdk.default({ apiKey: this.getKey(), dangerouslyAllowBrowser: true });
    return this.client;
  },
  apiErr(e) {
    const S = this.sdk || {};
    if (e && e.code && !(e instanceof Error)) return e;
    if (S.APIUserAbortError && e instanceof S.APIUserAbortError) return { code: 'cancelled' };
    if (e && e.name === 'AbortError') return { code: 'cancelled' };
    const detail = e ? (e.status ? e.status + ' · ' : '') + String((e.error && e.error.error && e.error.error.message) || e.message || '').slice(0, 160) : '';
    if (S.AuthenticationError && e instanceof S.AuthenticationError) return { code: 'bad_key', detail };
    if (S.PermissionDeniedError && e instanceof S.PermissionDeniedError) return { code: 'denied', detail };
    if (S.RateLimitError && e instanceof S.RateLimitError) return { code: 'rate_limited' };
    if (S.BadRequestError && e instanceof S.BadRequestError) {
      const m = String((e && e.message) || '');
      if (/credit balance/i.test(m)) return { code: 'no_credit' };
      if (/too long|too large/i.test(m)) return { code: 'prompt_too_large' };
      return { code: 'upstream_error' };
    }
    console.warn('API', e);
    return { code: 'upstream_error' };
  },
  /* Conversación del coach: mismos turnos que con Claude, con respuesta en streaming. */
  async apiText(turns, o) {
    const msgs = (typeof turns === 'string' ? [{ role: 'user', content: turns }] : turns).map((m) => ({ role: m.role, content: m.content }));
    let text = '';
    try {
      const client = await this.apiClient();
      const stream = client.beta.messages.stream({
        model: API_MODEL,
        max_tokens: 16000,
        output_config: { effort: o.modelTier === 'complex' ? 'medium' : 'low' },
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        messages: msgs,
      }, { signal: o.signal });
      stream.on('text', (d, snap) => { text = snap; if (o.onText) o.onText({ text: snap }); });
      const fin = await stream.finalMessage();
      if (fin.stop_reason === 'refusal') throw { code: 'refused', text };
      const out = fin.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
      if (!out.trim()) throw { code: 'empty_completion' };
      return { text: out, truncated: fin.stop_reason === 'max_tokens' };
    } catch (e) {
      const r = this.apiErr(e);
      if (text && !r.text) r.text = text;
      throw r;
    }
  },
  /* Comida por foto/texto y rutina pegada: respuesta en JSON. */
  async apiJson(prompt, o) {
    const content = [];
    for (const f of (o.images || []).slice(0, 4)) content.push(await imageBlock(f));
    content.push({ type: 'text', text: prompt + '\nResponde únicamente con el JSON, sin texto antes ni después.' });
    let res;
    try {
      const client = await this.apiClient();
      res = await client.beta.messages.create({
        model: API_MODEL,
        max_tokens: 16000,
        output_config: { effort: 'low' },
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        messages: [{ role: 'user', content }],
      }, { signal: o.signal });
    } catch (e) { throw this.apiErr(e); }
    if (res.stop_reason === 'refusal') throw { code: 'refused' };
    const t = res.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b <= a) throw { code: 'invalid_json' };
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw { code: 'invalid_json' }; }
  },
  msg(e) {
    const c = (e && e.code) || 'upstream_error';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(c) >= 0) {
      this.state = 'denied';
      if (c === 'not_granted') return 'No has dado permiso a Enten para usar Claude. Recarga la página y acepta el aviso para activar la IA.';
      return 'La IA no está disponible en esta cuenta o vista.';
    }
    switch (c) {
      case 'cancelled': return '';
      case 'rate_limited': return 'Has llegado al límite de uso de Claude por ahora. Prueba dentro de un rato.';
      case 'session_expired': return 'Tu sesión de Claude ha caducado. Vuelve a iniciar sesión y recarga.';
      case 'images_unavailable': return 'Esta vista no admite fotos. Describe la comida con texto.';
      case 'image_rejected': return 'No he podido usar esa imagen. Prueba con otra foto (JPG o PNG).';
      case 'refused': return 'La IA no ha respondido a esto. Reformúlalo.';
      case 'empty_completion': return 'No ha llegado respuesta. Prueba a pedir algo más concreto.';
      case 'invalid_json': return 'La respuesta no tenía el formato esperado. Vuelve a intentarlo.';
      case 'prompt_too_large': return 'Demasiados datos para una sola consulta. Empieza una conversación nueva.';
      case 'bad_key': return 'La clave de API no es válida o se ha revocado. Cámbiala en Ajustes → IA sin Claude.' + (e.detail ? ' (Anthropic: ' + e.detail + ')' : '');
      case 'denied': return 'Anthropic ha rechazado la petición.' + (e.detail ? ' (Anthropic: ' + e.detail + ')' : '');
      case 'no_credit': return 'Tu cuenta de la API de Anthropic no tiene saldo. Añade crédito en console.anthropic.com.';
      case 'sdk_load': return 'No se ha podido cargar la conexión con Claude. Revisa tu conexión a internet.';
      default: return 'Fallo de conexión con la IA. Inténtalo de nuevo.';
    }
  },
};

function imageBlock(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1568 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] } });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ code: 'image_rejected' }); };
    img.src = url;
  });
}

/* ---------- acciones que propone el coach ---------- */
function findDay(name) {
  const q = norm(name);
  const ds = routineDays();
  return ds.find((d) => norm(d.name) === q) || ds.find((d) => norm(d.name).indexOf(q) >= 0 || q.indexOf(norm(d.name)) >= 0) || null;
}
function findExIn(day, name) {
  const q = norm(name);
  const ex = (day && day.exercises) || [];
  return ex.find((e) => norm(e.name) === q) || ex.find((e) => norm(e.name).indexOf(q) >= 0 || q.indexOf(norm(e.name)) >= 0) || (matchLib(name) ? ex.find((e) => e.lib && e.lib === matchLib(name).id) : null) || null;
}
function parseReps(r, def) {
  const m = String(r == null ? '' : r).match(/(\d+)\s*(?:[-–a]\s*(\d+))?/);
  if (!m) return def;
  const a = +m[1], b = m[2] ? +m[2] : +m[1];
  return [Math.min(a, b), Math.max(a, b)];
}
const ISO = /^\d{4}-\d{2}-\d{2}$/;
function validAction(a) {
  if (!a || typeof a !== 'object') return false;
  switch (a.tipo) {
    case 'mover_entreno': return ISO.test(a.desde) && ISO.test(a.hasta);
    case 'dias_entreno': return Array.isArray(a.dias) && a.dias.every((d) => DOW.indexOf(d) >= 0);
    case 'sustituir_ejercicio': return !!(a.dia && a.ejercicio && a.nuevo);
    case 'anadir_ejercicio': return !!(a.dia && a.nuevo);
    case 'quitar_ejercicio': return !!(a.dia && a.ejercicio);
    case 'cambiar_series': return !!(a.dia && a.ejercicio && num(a.series, 0) > 0);
    case 'objetivos_nutricion': return num(a.kcal, 0) > 800 || num(a.proteina, 0) > 20;
    case 'objetivo_pasos': return num(a.pasos, 0) >= 1000;
    default: return false;
  }
}
function actionLabel(a) {
  switch (a.tipo) {
    case 'mover_entreno': return 'Mover el entreno de ' + fmtD(a.desde) + ' a ' + fmtD(a.hasta);
    case 'dias_entreno': return 'Entrenar los ' + a.dias.map((d) => DOWL[DOW.indexOf(d)]).join(', ');
    case 'sustituir_ejercicio': return 'En ' + a.dia + ': cambiar ' + a.ejercicio + ' por ' + a.nuevo + (a.series ? ' (' + a.series + ' × ' + (a.reps || '8-12') + ')' : '');
    case 'anadir_ejercicio': return 'En ' + a.dia + ': añadir ' + a.nuevo + ' ' + (a.series || 3) + ' × ' + (a.reps || '10-15');
    case 'quitar_ejercicio': return 'En ' + a.dia + ': quitar ' + a.ejercicio;
    case 'cambiar_series': return 'En ' + a.dia + ': ' + a.ejercicio + ' a ' + a.series + ' series';
    case 'objetivos_nutricion': return 'Objetivos: ' + (a.kcal ? fmt(a.kcal) + ' kcal' : '') + (a.kcal && a.proteina ? ' · ' : '') + (a.proteina ? fmt(a.proteina) + ' g de proteína' : '');
    case 'objetivo_pasos': return 'Objetivo de pasos: ' + fmt(a.pasos) + ' al día';
    default: return 'Acción';
  }
}
function applyAction(a) {
  const before = { routine: clone(S.routine), settings: clone(S.settings), cal: clone(S.cal) };
  const undo = () => {
    S.routine = before.routine; saveRoutine();
    S.settings = before.settings; saveSettings();
    const months = new Set(Object.keys(S.cal).concat(Object.keys(before.cal)));
    S.cal = before.cal;
    months.forEach((m) => { if (S.cal[m]) Store.save('calendar/' + m, S.cal[m]); else Store.remove('calendar/' + m); });
    bump(); render();
  };
  try {
    switch (a.tipo) {
      case 'mover_entreno': {
        setCalOv(a.desde, { st: 'skip', reason: 'Movido a ' + fmtD(a.hasta, 'dm') });
        if (!isPlanned(a.hasta)) setCalOv(a.hasta, { st: 'extra' });
        break;
      }
      case 'dias_entreno': {
        if (!S.routine) return { ok: false, msg: 'Primero configura tu rutina.' };
        S.routine.schedule = DOW.map((d) => a.dias.indexOf(d) >= 0); saveRoutine(); break;
      }
      case 'sustituir_ejercicio': case 'quitar_ejercicio': case 'cambiar_series': case 'anadir_ejercicio': {
        const d = findDay(a.dia);
        if (!d) return { ok: false, msg: 'No encuentro el día «' + a.dia + '» en tu rutina.' };
        if (a.tipo === 'anadir_ejercicio') {
          const rr = parseReps(a.reps, [10, 15]);
          d.exercises.push(makeEx({ name: a.nuevo, sets: clamp(Math.round(num(a.series, 3)), 1, 10), repMin: rr[0], repMax: rr[1] }));
        } else {
          const e = findExIn(d, a.ejercicio);
          if (!e) return { ok: false, msg: 'No encuentro «' + a.ejercicio + '» en ' + d.name + '.' };
          if (a.tipo === 'quitar_ejercicio') d.exercises.splice(d.exercises.indexOf(e), 1);
          else if (a.tipo === 'cambiar_series') e.sets = clamp(Math.round(num(a.series, e.sets)), 1, 12);
          else {
            const rr = parseReps(a.reps, [e.repMin, e.repMax]);
            const n = makeEx({ name: a.nuevo, sets: a.series ? clamp(Math.round(num(a.series, e.sets)), 1, 12) : e.sets, repMin: rr[0], repMax: rr[1], rest: e.rest });
            d.exercises.splice(d.exercises.indexOf(e), 1, n);
          }
        }
        saveRoutine(); break;
      }
      case 'objetivos_nutricion': {
        const tg = S.settings.targets = Object.assign({}, S.settings.targets, { mode: 'manual' });
        if (num(a.kcal, 0) > 800) tg.kcal = Math.round(num(a.kcal));
        if (num(a.proteina, 0) > 20) tg.p = Math.round(num(a.proteina));
        if (num(a.carbohidratos, 0) > 0) tg.c = Math.round(num(a.carbohidratos));
        if (num(a.grasa, 0) > 0) tg.f = Math.round(num(a.grasa));
        saveSettings(); break;
      }
      case 'objetivo_pasos': S.settings.stepGoal = Math.round(num(a.pasos, 8000)); saveSettings(); break;
      default: return { ok: false, msg: 'Acción desconocida.' };
    }
  } catch (e) {
    console.error(e);
    return { ok: false, msg: 'No se pudo aplicar el cambio.' };
  }
  bump();
  return { ok: true, msg: 'Cambio aplicado', undo };
}
function splitActions(text) {
  const t = String(text || '');
  const m = t.match(/```\s*acciones\s*([\s\S]*?)```/i);
  if (!m) {
    const i = t.search(/```\s*acciones/i);
    if (i >= 0) return { text: t.slice(0, i).trim(), acts: [] };
    return { text: t.trim(), acts: [] };
  }
  let acts = [];
  try { const j = JSON.parse(m[1].trim()); acts = Array.isArray(j) ? j : [j]; } catch (e) { acts = []; }
  return { text: (t.slice(0, m.index) + t.slice(m.index + m[0].length)).trim(), acts: acts.filter(validAction).slice(0, 4) };
}

/* ============ Enten · estado y lógica ============ */

/* ---------- ejercicios ---------- */
function matchLib(name) {
  const q = norm(name);
  if (!q) return null;
  let best = null, bs = 0;
  const qt = q.split(' ').filter((t) => t.length > 2);
  for (const e of EX) {
    for (const n of e._names) {
      let sc;
      if (n === q) sc = 100;
      else if (q.indexOf(n) >= 0 || n.indexOf(q) >= 0) sc = 60 + (Math.min(n.length, q.length) / Math.max(n.length, q.length)) * 30;
      else {
        const nt = n.split(' ').filter((t) => t.length > 2);
        const inter = nt.filter((t) => qt.indexOf(t) >= 0).length;
        sc = nt.length ? (inter / Math.max(nt.length, qt.length || 1)) * 55 : 0;
      }
      if (sc > bs) { bs = sc; best = e; }
    }
  }
  return bs >= 45 ? best : null;
}
function defaultRest(L) {
  if (!L) return 90;
  if (L.type === 'cardio') return 0;
  if (COMPOUND_PATS.indexOf(L.pat) >= 0 && L.eq !== 'polea') return 150;
  return 75;
}
function makeEx(o) {
  const L = o.lib ? EXI[o.lib] : matchLib(o.name);
  return {
    id: uid('e'), lib: L ? L.id : null, name: o.name || (L ? L.n : 'Ejercicio'),
    sets: o.sets || 3, repMin: o.repMin || 8, repMax: o.repMax || o.repMin || 12,
    rest: o.rest || defaultRest(L), w0: o.w0 == null ? null : o.w0, inc: o.inc != null ? o.inc : L ? L.inc : 2.5,
    p: o.p || (L ? L.p.slice() : []), s: o.s || (L ? L.s.slice() : []), type: L ? L.type : (o.type || 'reps'), note: o.note || '',
  };
}
function exKey(e) { return e.lib ? e.lib : 'n:' + norm(e.name); }
function e1rm(w, r) { w = +w || 0; r = +r || 0; if (r <= 0 || w <= 0) return 0; if (r === 1) return w; return w * (1 + Math.min(r, 20) / 30); }
function bestE1(sets) { let b = 0; for (const s of sets || []) b = Math.max(b, e1rm(s.w, s.r)); return b; }
function fmtSets(sets, type) {
  const v = (sets || []).filter((s) => s.r > 0);
  if (!v.length) return '—';
  if (type === 'cardio') return v.map((s) => s.r + ' min').join(' · ');
  if (type === 'time') return v.map((s) => ((+s.w || 0) ? fmtKg(s.w) + ' kg × ' : '') + s.r + ' s').join(' · ');
  const ws = new Set(v.map((s) => +s.w || 0));
  if (ws.size === 1) { const w = +v[0].w || 0; return (w ? fmtKg(w) + ' kg × ' : '') + v.map((s) => s.r).join(', ') + (w ? '' : ' reps'); }
  return v.map((s) => fmtKg(s.w) + '×' + s.r).join(' · ');
}
function exTarget(e) {
  if (e.type === 'cardio') return (e.repMax || 20) + ' min';
  if (e.type === 'time') return e.sets + ' × ' + (e.repMax || 30) + ' s';
  return e.sets + ' × ' + (e.repMin === e.repMax ? e.repMax : e.repMin + '–' + e.repMax);
}
function estDuration(d) {
  const ex = (d && d.exercises) || [];
  let s = 300;
  for (const e of ex) {
    if (e.type === 'cardio') s += (e.repMax || 20) * 60;
    else s += (+e.sets || 3) * (45 + (+e.rest || 90));
  }
  return Math.max(10, Math.round(s / 300) * 5);
}
function dayMuscles(d) {
  const m = {};
  for (const e of (d && d.exercises) || []) for (const x of e.p || []) m[x] = (m[x] || 0) + (+e.sets || 0);

/* ---------- importar datos de Apple Salud (texto del atajo) ---------- */
const HKEYS = [
  ['steps', ['pasos', 'steps', 'step count', 'recuento de pasos']],
  ['active', ['energia activa', 'activa', 'kcal activas', 'calorias activas', 'active energy', 'active']],
  ['diet', ['energia alimentaria', 'energia consumida', 'alimentaria', 'consumidas', 'dietary energy', 'dieta', 'calorias consumidas', 'calorias', 'kcal']],
  ['weight', ['peso corporal', 'peso', 'weight', 'body mass']],
  ['dist', ['distancia', 'distance', 'km']],
  ['water', ['agua', 'water']],
  ['prot', ['proteinas', 'proteina', 'protein']],
  ['carbs', ['carbohidratos', 'hidratos', 'carbs', 'carbohydrates']],
  ['fat', ['grasas totales', 'grasas', 'grasa', 'fat']],
  ['sleep', ['sueno', 'sleep']],
];
const HRANGE = { steps: [0, 100000], active: [0, 8000], diet: [0, 10000], weight: [25, 350], dist: [0, 200], water: [0, 10000], prot: [0, 800], carbs: [0, 1500], fat: [0, 600], sleep: [0, 24] };
const MONTHS_ALL = { ene: 1, enero: 1, jan: 1, january: 1, feb: 2, febrero: 2, february: 2, mar: 3, marzo: 3, march: 3, abr: 4, abril: 4, apr: 4, april: 4, may: 5, mayo: 5, jun: 6, junio: 6, june: 6, jul: 7, julio: 7, july: 7, ago: 8, agosto: 8, aug: 8, august: 8, sep: 9, sept: 9, septiembre: 9, setiembre: 9, september: 9, oct: 10, octubre: 10, october: 10, nov: 11, noviembre: 11, november: 11, dic: 12, diciembre: 12, dec: 12, december: 12 };
function hkey(line) {
  const n = norm(line);
  for (const [k, al] of HKEYS) if (al.some((a) => n === a || n.indexOf(a + ' ') === 0)) return k;
  return null;
}
function findDate(s) {
  let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return { k: ymd(+m[1], +m[2], +m[3]), rest: s.replace(m[0], ' ') };
  m = s.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return { k: ymd(y, +m[2], +m[1]), rest: s.replace(m[0], ' ') }; }
  const n = norm(s);
  m = n.match(/(\d{1,2}) (?:de )?([a-z]+)(?: de)? (\d{4})/);
  if (m && MONTHS_ALL[m[2]]) return { k: ymd(+m[3], MONTHS_ALL[m[2]], +m[1]), rest: n.replace(m[0], ' ') };
  m = n.match(/([a-z]+) (\d{1,2}) (\d{4})/);
  if (m && MONTHS_ALL[m[1]]) return { k: ymd(+m[3], MONTHS_ALL[m[1]], +m[2]), rest: n.replace(m[0], ' ') };
  return null;
}
function parseNum(str, key) {
  const m = String(str).match(/-?\d[\d.,]*/);
  if (!m) return null;
  const t = m[0].replace(/[.,]+$/, '');
  if (key === 'steps') { const v = parseInt(t.replace(/[.,]/g, ''), 10); return Number.isFinite(v) ? v : null; }
  const cands = [];
  const hasDot = t.indexOf('.') >= 0, hasCom = t.indexOf(',') >= 0;
  if (hasDot && hasCom) cands.push(t.lastIndexOf(',') > t.lastIndexOf('.') ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, ''));
  else if (hasCom) { cands.push(t.replace(/,(?=.*,)/g, '').replace(',', '.')); if (/^\d{1,3}(,\d{3})+$/.test(t)) cands.push(t.replace(/,/g, '')); }
  else if (hasDot) { if (/^\d{1,3}(\.\d{3})+$/.test(t)) cands.push(t.replace(/\./g, '')); cands.push(t.replace(/\.(?=.*\.)/g, '')); }
  else cands.push(t);
  const r = HRANGE[key] || [-Infinity, Infinity];
  for (const c of cands) { const v = parseFloat(c); if (Number.isFinite(v) && v >= r[0] && v <= r[1]) return v; }
  const v = parseFloat(cands[0]);
  return Number.isFinite(v) ? v : null;
}
function parseHealth(text) {
  const days = {}, counts = {};
  const put = (k, key, v) => {
    if (!k || v == null || !Number.isFinite(v)) return;
    if (key === 'water' && v > 0 && v < 20) v = v * 1000;
    if (key === 'dist' && v > 200) v = v / 1000;
    const d = days[k] || (days[k] = {});
    d[key] = key === 'weight' || key === 'sleep' ? rnd(v, 1) : key === 'dist' ? rnd(v, 2) : rnd(v);
    counts[key] = (counts[key] || 0) + 1;
  };
  const sections = [];
  let cur = null;
  for (const raw of String(text || '').split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || /^enten\b/i.test(line) || /^[=\-]+$/.test(line)) continue;
    if (!/\d/.test(line)) { const k = hkey(line); if (k) { cur = { key: k, dates: [], vals: [], pairs: [] }; sections.push(cur); } continue; }
    if (!cur) continue;
    const clean = line.replace(/T?\d{1,2}:\d{2}(?::\d{2})?(?:\.\d+)?\s*(?:Z|[+-]\d{2}:?\d{2})?/g, ' ').replace(/\b[ap]\.?\s?m\.?/gi, ' ');
    const dt = findDate(clean);
    if (dt && dt.k) {
      const v = /\d/.test(dt.rest) ? parseNum(dt.rest, cur.key) : null;
      if (v != null) cur.pairs.push([dt.k, v]); else cur.dates.push(dt.k);
    } else {
      const v = parseNum(clean, cur.key);
      if (v != null) cur.vals.push(v);
    }
  }
  for (const s of sections) {
    s.pairs.forEach((p) => put(p[0], s.key, p[1]));
    const n = Math.min(s.dates.length, s.vals.length);
    for (let i = 0; i < n; i++) put(s.dates[i], s.key, s.vals[i]);
    if (!s.dates.length && !s.pairs.length && s.vals.length === 1) put(today(), s.key, s.vals[0]);
    // Atajo sin la línea de fechas: con «Agrupar por día» y «Más antiguo primero», el último valor es hoy
    // y cada uno de los anteriores es un día antes.
    else if (!s.dates.length && !s.pairs.length && s.vals.length > 1 && s.key !== 'weight') {
      const n = s.vals.length;
      s.vals.forEach((v, i) => put(addD(today(), i - (n - 1)), s.key, v));
    }
  }
  return { days, counts };
}
function mergeHealth(days) {
  const touched = {};
  for (const k in days) {
    const key = mk(k);
    const m = S.health[key] || (S.health[key] = { month: key, days: {} });
    m.days[k] = Object.assign({}, m.days[k], days[k], { src: 'salud' });
    touched[key] = true;
  }
  Object.keys(touched).forEach((key) => Store.save('health/' + key, S.health[key]));
  S.settings.lastSync = Date.now();
  saveSettings();
  bump();
}

/* ============ Enten · gráficos SVG ============
   Marcas finas (líneas 2 px, barras ≤ 24 px con 4 px redondeados arriba y separación de 2 px),
   rejilla tenue, una sola escala por gráfico y tooltip al tocar. */
const CH = {};
let chSeq = 0;

function niceTicks(min, max, n) {
  if (!(max > min)) max = min + 1;
  const step0 = (max - min) / (n || 4);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const e = step0 / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(rnd(v, 6));
  return { lo, hi, ticks };
}
const tickFmt = (v) => (Math.abs(v) >= 10000 ? fmt(v / 1000, 0) + ' k' : Math.abs(v) >= 1000 ? fmt(v / 1000, 1) + ' k' : fmt(v, 1));
function emptyChart(msg) { return '<div class="ch-empty">' + esc(msg) + '</div>'; }
function barPath(x, y, w, h, r) {
  if (h <= 0.5) return '';
  r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
}
function tableView(rows, head) {
  if (!rows.length) return '';
  return '<details class="tview"><summary>' + ic('list', 'sm') + 'Ver datos</summary><div class="tscroll"><table><thead><tr><th>' + esc(head[0]) + '</th><th>' + esc(head[1]) + '</th></tr></thead><tbody>' +
    rows.slice().reverse().map((r) => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>').join('') + '</tbody></table></div></details>';
}

/* Línea: o = {pts:[{k,y}], avg:[{k,y}], goal, from, to, unit, dec, zero, empty} */
function lineChart(o) {
  const pts = (o.pts || []).filter((p) => p.y != null);
  if (!pts.length) return emptyChart(o.empty || 'Sin datos todavía');
  const id = 'ch' + (++chSeq);
  const W = 340, H = 168, L = 36, R = 46, T = 14, B = 24;
  const from = o.from || pts[0].k, to = o.to || pts[pts.length - 1].k;
  const span = Math.max(1, diffD(from, to));
  const line = o.avg && o.avg.length ? o.avg : pts;
  const ys = pts.map((p) => p.y).concat(line.map((p) => p.y)).concat(o.goal != null ? [o.goal] : []);
  let mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys);
  const pad = (mx - mn) * 0.15 || Math.max(1, mx * 0.02);
  const nt = niceTicks(o.zero ? 0 : mn - pad, mx + pad, 3);
  const X = (k) => L + (W - L - R) * (diffD(from, k) / span);
  const Y = (v) => T + (H - T - B) * (1 - (v - nt.lo) / (nt.hi - nt.lo));
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" data-ch="' + id + '" role="img" aria-label="' + esc(o.label || 'Gráfico') + '">';
  nt.ticks.forEach((v) => { const y = Y(v).toFixed(1); s += '<line class="ch-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text class="ch-lbl" x="' + (L - 6) + '" y="' + (+y + 3) + '" text-anchor="end">' + tickFmt(v) + '</text>'; });
  const xl = [from, span > 2 ? addD(from, Math.round(span / 2)) : null, to].filter(Boolean);
  xl.forEach((k, i) => { s += '<text class="ch-lbl" x="' + X(k).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? 'start' : i === xl.length - 1 ? 'end' : 'middle') + '">' + fmtD(k, 'dm') + '</text>'; });
  if (o.goal != null && o.goal >= nt.lo && o.goal <= nt.hi) {
    const gy = Y(o.goal).toFixed(1);
    s += '<line class="ch-goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '"/><text class="ch-lbl" x="' + (W - R + 4) + '" y="' + (+gy + 3) + '">obj.</text>';
  }
  if (o.avg && o.avg.length) pts.forEach((p) => { s += '<circle class="ch-pt" cx="' + X(p.k).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="2.4"/>'; });
  const d = line.map((p, i) => (i ? 'L' : 'M') + X(p.k).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
  if (o.area) s += '<path class="ch-area" d="' + d + 'L' + X(line[line.length - 1].k).toFixed(1) + ',' + (H - B) + 'L' + X(line[0].k).toFixed(1) + ',' + (H - B) + 'Z"/>';
  s += '<path class="ch-line" d="' + d + '"/>';
  const end = line[line.length - 1];
  s += '<circle class="ch-dot" cx="' + X(end.k).toFixed(1) + '" cy="' + Y(end.y).toFixed(1) + '" r="4.5"/>';
  s += '<text class="ch-end" x="' + (X(end.k) + 8).toFixed(1) + '" y="' + (Y(end.y) + 4).toFixed(1) + '">' + fmt(end.y, o.dec == null ? 1 : o.dec) + '</text>';
  s += '<line class="ch-cross" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '"/><circle class="ch-dot ch-hl" r="4.5" cx="-10" cy="-10" style="opacity:0"/></svg>';
  CH[id] = { W, pts: pts.map((p) => {
    const a = (o.avg || []).find((q) => q.k === p.k);
    return { x: X(p.k), y: Y(a ? a.y : p.y), t: cap(fmtD(p.k)) + ' · ' + fmt(p.y, o.dec == null ? 1 : o.dec) + (o.unit ? ' ' + o.unit : '') + (a ? ' (media ' + fmt(a.y, 1) + ')' : '') };
  }) };
  return '<div class="chart">' + s + '<div class="tip" hidden></div></div>';
}

/* Barras: o = {bars:[{k, y, lbl}], goal, unit, dec, hitGoal (resalta las que llegan al objetivo)} */
function barChart(o) {
  const bars = o.bars || [];
  if (!bars.length || !bars.some((b) => b.y > 0)) return emptyChart(o.empty || 'Sin datos todavía');
  const id = 'ch' + (++chSeq);
  const W = 340, H = 160, L = 36, R = 10, T = 12, B = 24;
  const mx = Math.max.apply(null, bars.map((b) => b.y || 0).concat(o.goal ? [o.goal] : []));
  const nt = niceTicks(0, mx * 1.08, 3);
  const Y = (v) => T + (H - T - B) * (1 - v / nt.hi);
  const slot = (W - L - R) / bars.length;
  const bw = Math.max(2, Math.min(24, slot - 2));
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" data-ch="' + id + '" role="img" aria-label="' + esc(o.label || 'Gráfico de barras') + '">';
  nt.ticks.forEach((v) => { const y = Y(v).toFixed(1); s += '<line class="' + (v === 0 ? 'ch-base' : 'ch-grid') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text class="ch-lbl" x="' + (L - 6) + '" y="' + (+y + 3) + '" text-anchor="end">' + tickFmt(v) + '</text>'; });
  const hit = [];
  bars.forEach((b, i) => {
    const x = L + slot * i + (slot - bw) / 2, y = Y(b.y || 0), h = Y(0) - y;
    const cls = o.goal && o.hitGoal ? (b.y >= o.goal ? 'ch-bar hit' : 'ch-bar') : b.dim ? 'ch-bar dim' : 'ch-bar';
    s += '<path class="' + cls + '" d="' + barPath(x, y, bw, h, bw >= 8 ? 4 : bw / 2) + '"/>';
    hit.push({ x: x + bw / 2, y, t: (b.lbl || cap(fmtD(b.k))) + ' · ' + fmt(b.y || 0, o.dec || 0) + (o.unit ? ' ' + o.unit : '') });
  });
  const step = Math.ceil(bars.length / 6);
  bars.forEach((b, i) => {
    if (i % step && i !== bars.length - 1) return;
    if (i !== bars.length - 1 && bars.length - 1 - i < step) return;
    s += '<text class="ch-lbl" x="' + (L + slot * i + slot / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(b.tick || fmtD(b.k, 'dm')) + '</text>';
  });
  if (o.goal) { const gy = Y(o.goal).toFixed(1); s += '<line class="ch-goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '"/>'; }
  s += '<line class="ch-cross" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '"/></svg>';
  CH[id] = { W, pts: hit };
  return '<div class="chart">' + s + '<div class="tip" hidden></div></div>';
}

function ring(o) {
  const size = o.size || 88, sw = o.sw || 8, r = (size - sw) / 2, c = 2 * Math.PI * r;

function chartPoint(e) {
  const svg = e.target.closest && e.target.closest('svg[data-ch]');
  if (!svg) return;
  const d = CH[svg.dataset.ch];
  if (!d || !d.pts.length) return;
  const rect = svg.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * d.W;
  let best = d.pts[0], bd = Infinity;
  for (const p of d.pts) { const dd = Math.abs(p.x - x); if (dd < bd) { bd = dd; best = p; } }
  const cross = svg.querySelector('.ch-cross');
  if (cross) { cross.setAttribute('x1', best.x); cross.setAttribute('x2', best.x); cross.style.opacity = 1; }
  const hl = svg.querySelector('.ch-hl');
  if (hl) { hl.setAttribute('cx', best.x); hl.setAttribute('cy', best.y); hl.style.opacity = 1; }
  const tip = svg.parentElement.querySelector('.tip');
  if (tip) {
    tip.textContent = best.t;
    tip.hidden = false;
    const px = (best.x / d.W) * rect.width;
    tip.style.left = clamp(px, 70, rect.width - 70) + 'px';
  }
}
function chartLeave(svg) {
  const cross = svg.querySelector('.ch-cross'), hl = svg.querySelector('.ch-hl'), tip = svg.parentElement.querySelector('.tip');
  if (cross) cross.style.opacity = 0;
  if (hl) hl.style.opacity = 0;
  if (tip) tip.hidden = true;
}

document.addEventListener('pointerdown', (e) => {
  const svg = e.target.closest && e.target.closest('svg[data-ch]');

});

function weekStrip() {
  const W = weekInfo(), t = today();
  const target = W.days.some((d) => d.st === 'none') ? W.planned : Math.max(W.planned, sched().filter(Boolean).length);
  const cells = W.days.map((d, i) => '<button class="wk-d st-' + d.st + (d.k === t ? ' is-today' : '') + '" data-act="dayDetail" data-date="' + d.k + '" aria-label="' + DOWL[i] + ' ' + pd(d.k).getDate() + ': ' + ST_LABEL[d.st] + '"><span class="wk-l">' + DOW[i] + '</span><span class="wk-n">' + pd(d.k).getDate() + '</span><i class="wk-dot"></i></button>').join('');
  let note = '';
  if (W.missed) note = W.missed + ' ' + plural(W.missed, 'entreno sin registrar', 'entrenos sin registrar') + '. Toca el día para apuntar el motivo o registrarlo.';
  else if (W.skipped) note = W.skipped + ' ' + plural(W.skipped, 'día saltado', 'días saltados') + ' esta semana.';
  return '<section class="card"><div class="card-h"><h3>Esta semana</h3><span class="muted">' + W.done + ' / ' + (target || '—') + ' entrenos</span></div><div class="wk-row">' + cells + '</div>' +

}

function srcLabel(src) { return src === 'salud' ? 'Desde Apple Salud' : src === 'enten' ? 'Tu diario' : 'Sin registros'; }
function ringStat(o) {
  return '<div class="rstat"><div class="rstat-w">' + o.svg + '<div class="rstat-c"><b>' + o.val + '</b><span>' + esc(o.sub) + '</span></div></div><span class="rstat-l">' + esc(o.lbl) + '</span></div>';
}
function macroRow(l, v, max, cls) {
  return '<div class="mrow"><span class="mrow-l"><i class="dot d-' + cls + '"></i>' + l + '</span><span class="mrow-v"><b>' + fmt(v) + '</b> / ' + fmt(max) + ' g · ' + (max ? fmt((v / max) * 100) : 0) + ' %</span>' + meter(v, max, 'm-' + cls) + '</div>';
}
function energyCard(k, link) {
  const T = targets(), tot = dayTotals(k), b = burned(k), rem = T.kcal - tot.kcal;
  return '<section class="card"><div class="card-h"><h3>Energía</h3>' + (link ? '<button class="link" data-act="go" data-tab="nutricion">Diario' + ic('right') + '</button>' : '<span class="muted small">' + srcLabel(tot.src) + '</span>') + '</div>' +
    '<div class="rings">' +
    ringStat({ svg: ring({ v: tot.kcal, max: T.kcal, cls: tot.kcal > T.kcal * 1.05 ? 'r-over' : '' }), val: fmt(tot.kcal), sub: 'de ' + fmt(T.kcal), lbl: 'Consumido' }) +
    ringStat({ svg: ring2(b.bmr, Math.max(0, b.active)), val: fmt(b.total), sub: b.est ? 'estimado' : 'kcal', lbl: 'Quemado' }) +
    ringStat({ svg: ring({ v: Math.max(0, rem), max: T.kcal, cls: rem < 0 ? 'r-over' : 'r-soft' }), val: fmt(Math.abs(rem)), sub: 'kcal', lbl: rem < 0 ? 'Te pasas' : 'Restante' }) +
    '</div><div class="macros">' + macroRow('Proteína', tot.p, T.p, 'prot') + macroRow('Carbohidratos', tot.c, T.c, 'carb') + macroRow('Grasa', tot.f, T.f, 'fat') + (link ? '' : macroRow('Fibra', tot.fib, T.fib, 'fib')) + '</div>' +
    (link ? '' : '<p class="srcnote">' + ic('info', 'sm') + 'Quemado = metabolismo basal (' + fmt(b.bmr) + ') + actividad (' + fmt(Math.max(0, b.active)) + ')' + (b.est ? ', estimada hasta que sincronices con Salud.' : ' de Apple Salud.') + '</p>') +
    '</section>';
}
function stepsCard(k) {

function waterCard(k, mini) {

    '<div class="water-btns"><button class="btn" data-act="water" data-ml="-250" data-date="' + k + '" aria-label="Quitar 250 ml">−250</button><button class="btn" data-act="water" data-ml="250" data-date="' + k + '">+250 ml</button><button class="btn" data-act="water" data-ml="500" data-date="' + k + '">+500 ml</button></div></section>';
}
function fastMini() {

/* ---------- días: detalle, faltas y reprogramación ---------- */
ACT.dayDetail = (el) => {
  const k = el.dataset.date, st = dayStatus(k), ss = idx().byDate[k] || [], o = calOv(k);
  const t = today(), past = k < t;
  let html = '<p class="lead">' + esc(cap(fmtD(k, 'long'))) + ' · <span class="muted">' + ST_LABEL[st] + '</span></p>';
  if (ss.length) html += ss.map((s) => '<button class="hrow" data-act="openSession" data-sid="' + s.id + '"><div><b>' + esc(s.dayName) + '</b><span class="muted small">' + fmtMin(s.dur || 0) + ' · Σ ' + fmt(s.vol || 0) + ' kg</span></div>' + ic('right') + '</button>').join('');
  if (o && o.st === 'skip') html += '<p class="fg2">Motivo: ' + esc(o.reason || 'sin motivo') + '</p>';
  const btns = [];
  if (!ss.length && (st === 'miss' || st === 'today' || st === 'plan')) btns.push('<button class="btn" data-act="cantGo" data-date="' + k + '">' + (past ? 'No fui: apuntar motivo' : 'No podré ir') + '</button>');
  if (!ss.length && k <= t && routineDays().length) btns.push('<button class="btn" data-act="logPast" data-date="' + k + '">Registrar entreno de este día</button>');
  if (o && o.st === 'skip') btns.push('<button class="btn" data-act="undoSkip" data-date="' + k + '">Quitar «no fui»</button>');
  if (st === 'rest' && k >= t) btns.push('<button class="btn" data-act="addExtra" data-date="' + k + '">Planificar entreno este día</button>');
  if (o && o.st === 'extra') btns.push('<button class="btn" data-act="clearOv" data-date="' + k + '">Quitar entreno extra</button>');
  if (!o && sched()[wd(k)] && k >= t && !ss.length) btns.push('<button class="btn btn-ghost" data-act="dayOff" data-date="' + k + '">Marcar como descanso</button>');
  html += '<div class="form">' + btns.join('') + '</div>';
  sheet(html, { title: relD(k) });
};
ACT.addExtra = (el) => { setCalOv(el.dataset.date, { st: 'extra' }); closeAllSheets(); render(); toast('Entreno planificado'); };
ACT.clearOv = (el) => { setCalOv(el.dataset.date, null); closeAllSheets(); render(); };
ACT.dayOff = (el) => { setCalOv(el.dataset.date, { st: 'off' }); closeAllSheets(); render(); toast('Marcado como descanso'); };
ACT.undoSkip = (el) => { setCalOv(el.dataset.date, null); closeAllSheets(); render(); toast('Listo, vuelve a contar como día de entreno'); };

ACT.cantGo = (el) => {
  closeAllSheets();
  const k = el.dataset.date || today(), t = today(), nd = nextDay();
  const free = freeDaysAfter(k < t ? t : k, 6);
  const best = free[0];
  UI.skip = { k, reason: '' };
  const html = '<p class="muted">' + (nd ? 'Tocaba <b class="fg2">' + esc(nd.name) + '</b>. ' : '') + 'La rotación no se pierde: el siguiente entreno será el pendiente, así no te saltas ningún grupo muscular.</p>' +
    '<div class="field"><span>Motivo</span><div class="chips" id="skipReasons">' + SKIP_REASONS.map((r) => '<button class="chip" data-act="skipReason" data-r="' + esc(r) + '">' + esc(r) + '</button>').join('') + '</div></div>' +
    '<div class="form">' +
    (best ? '<button class="btn btn-primary" data-act="skipDo" data-mode="move" data-to="' + best + '">Mover a ' + esc(relD(best).toLowerCase()) + ' (día libre)</button>' : '') +
    '<button class="btn" data-act="skipDo" data-mode="skip">Saltar y seguir la rotación</button>' +
    (k === t ? '<button class="btn" data-act="skipDo" data-mode="short">Hacer versión exprés (~30 min)</button>' : '') +
    '<button class="btn btn-ghost" data-act="skipDo" data-mode="coach">' + ic('sparkle') + 'Preguntar al coach</button></div>';
  sheet(html, { title: k === t ? 'Hoy no puedo ir' : 'No fui · ' + fmtD(k) });
};
ACT.skipReason = (el) => {
  UI.skip.reason = el.dataset.r;
  $$('#skipReasons .chip').forEach((c) => c.classList.toggle('on', c === el));
};
ACT.skipDo = (el) => {
  const m = el.dataset.mode, k = UI.skip.k, reason = UI.skip.reason;
  if (m === 'short') { closeAllSheets(); const nd = nextDay(); if (nd) startWorkout(nd.id, { short: true }); return; }
  if (m === 'coach') {
    closeAllSheets();
    coachSend((k === today() ? 'Hoy' : 'El ' + fmtD(k)) + ' no puedo ir al gimnasio' + (reason ? ' (' + reason.toLowerCase() + ')' : '') + '. ¿Qué hago hoy y a qué día muevo el entreno para no perder la semana?');
    return;
  }
  setCalOv(k, { st: 'skip', reason: reason || '' });
  if (m === 'move' && el.dataset.to) setCalOv(el.dataset.to, { st: 'extra' });
  closeAllSheets();
  render();
  toast(m === 'move' ? 'Movido a ' + relD(el.dataset.to).toLowerCase() : 'Apuntado. La rotación te espera', { action: 'Deshacer', fn: () => { setCalOv(k, null); if (m === 'move' && el.dataset.to) setCalOv(el.dataset.to, null); render(); } });
};
ACT.logPast = (el) => {
  closeAllSheets();
  const k = el.dataset.date;
  pickDaySheet((dayId) => startWorkout(dayId, { date: k }), 'Registrar ' + relD(k).toLowerCase());
};

function entRutina() {
  const ds = routineDays();

ACT.useTpl = async (el) => {

  const R = routineFromTemplate(t);

ACT.openImportRoutine = () => {
  closeAllSheets();

  sheet('<p class="muted">Pega tu rutina tal cual (de notas, WhatsApp o un PDF). Ejemplo: «Lunes pecho: press banca 4x8-10, aperturas 3x12…». La IA la convierte, asigna los músculos y luego puedes revisarla.</p>' +
    '<label class="field"><span>Tu rutina</span><textarea id="rtIn" placeholder="Día 1 – Pecho y tríceps&#10;Press banca 4x8&#10;…"></textarea></label>' +

};
ACT.parseRoutine = async (el) => {
  const txt = (($('#rtIn') || {}).value || '').trim();
  if (txt.length < 10) { toast('Pega tu rutina primero'); return; }
  el.disabled = true;
  const st = $('#rtStatus');
  if (st) st.hidden = false;
  try {
    const j = await AI.json(routinePrompt(txt), { modelTier: 'default', cache: false });
    const r = routineFromJson(j);
    if (!r.days.length) throw { code: 'empty_completion' };
    closeAllSheets();
    previewRoutine(r);

    const m = AI.msg(e);
    if (m) toast(m);

function previewRoutine(r) {

  sheet('<p class="muted">Revisa que esté bien. Después podrás ajustar cada día.</p>' +
    r.days.map((d) => '<section class="card"><h3>' + esc(d.name) + '</h3><ul class="exlist">' + d.exercises.map((e) => '<li><span class="exn">' + esc(e.name) + '<br><span class="muted small">' + esc(e.p.map((m) => MUSCLES[m].l).join(', ') || 'sin músculos') + '</span></span><span class="exs">' + exTarget(e) + (e.w0 ? ' · ' + fmtKg(e.w0) + ' kg' : '') + '</span></li>').join('') + '</ul></section>').join('') +
    (r.schedule ? '<p class="fg2">Días: ' + DOW.filter((d, i) => r.schedule[i]).join(', ') + '</p>' : '') +
    (unk.length ? '<p class="err">Sin músculos asignados: ' + esc(unk.join(', ')) + '. Edítalos después para que el análisis sea exacto.</p>' : '') +
    '<div class="btn-row"><button class="btn" data-act="sheetClose">Cancelar</button><button class="btn btn-primary" data-act="acceptRoutine">Guardar rutina</button></div>', { title: 'Tu rutina' });
}
ACT.acceptRoutine = () => {
  const r = UI.pendingRoutine;
  if (!r) return;
  const sc = r.schedule || (S.routine ? sched().slice() : null) || [true, false, true, false, true, false, false];

  saveRoutine();
  UI.pendingRoutine = null;
  closeAllSheets();
  UI.seg = 'rutina';
  go('entreno');
  toast('Rutina guardada');
};

function pickExercise(cb, title) {

function exResults(q) {
  const n = norm(q);

  if (q.trim()) html = '<button class="hrow" data-act="exPickCustom"><div><b>Crear «' + esc(q.trim()) + '»</b><span class="muted small">Ejercicio propio: elige sus músculos después</span></div>' + ic('plus') + '</button>' + html;

ON.exSearch = (el) => { $('#exRes').innerHTML = exResults(el.value); };
ACT.exPick = (el) => {

function entCal() {

    cells += '<button class="cal-c st-' + st + (k === today() ? ' is-today' : '') + '" data-act="dayDetail" data-date="' + k + '" aria-label="' + d + ' de ' + MON[mo - 1] + ': ' + ST_LABEL[st] + '"><span>' + d + '</span><i></i></button>';
  }

    '<div class="legend"><span><i style="background:var(--accent)"></i>Hecho</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--accent)"></i>Planificado</span><span><i style="background:var(--warn)"></i>No fui</span><span><i style="background:var(--crit)"></i>Sin registrar</span></div></section>' +
    '<div class="grid3">' + statBox('Esta semana', W.done + ' / ' + (Math.max(W.planned, sched().filter(Boolean).length) || '—')) + statBox('Asistencia 4 sem.', A.pct == null ? '—' : fmt(A.pct * 100) + ' %') + statBox('Racha', streak + ' ' + plural(streak, 'semana', 'semanas')) + '</div>' +

/* ---------- análisis ---------- */
function volRow(r) {
  const M = MUSCLES[r.m], max = Math.max(28, M.max + 4), pc = (v) => clamp((v / max) * 100, 0, 100);
  return '<div class="vrow"><div class="vrow-h"><span>' + M.l + '</span><span class="vrow-v">' + fmt(r.v, 1) + ' series</span>' + statPill(M.core || r.st === 'high' || r.st === 'vhigh' ? r.st : 'none') + '</div>' +
    '<div class="vbar" title="Rango óptimo ' + M.lo + '–' + M.hi + '">' + (M.hi > 0 ? '<b style="left:' + pc(M.lo) + '%;width:' + (pc(M.hi) - pc(M.lo)) + '%"></b>' : '') + '<i style="width:' + pc(r.v) + '%"></i></div></div>';
}
function flagRow(f) { return '<div class="flag ' + f.lvl + '">' + ic(f.lvl === 'warn' ? 'info' : 'sparkle') + '<span>' + esc(f.text) + '</span></div>'; }
function entAnal() {
  if (!routineDays().length) return emptyRoutine();
  const A = analyzeRoutine();
  const rows = A.rows.filter((r) => r.v > 0 || MUSCLES[r.m].core);
  return '<section class="card"><div class="card-h"><div><p class="eyebrow">Σ series por semana</p><h3>Volumen por músculo</h3></div></div>' +
    '<p class="small muted">Series fraccionadas: el músculo principal cuenta 1 y el secundario 0,5. La franja verde es el rango que mejor funciona para la mayoría. Calculado con ' + plannedPerWeek() + ' entrenos por semana.</p>' +
    '<div class="vrows">' + rows.map(volRow).join('') + '</div></section>' +
    '<section class="card"><div class="card-h"><h3>Revisión de la rutina</h3><span class="muted small">' + A.flags.length + ' ' + plural(A.flags.length, 'aviso', 'avisos') + '</span></div>' +
    (A.flags.length ? A.flags.map(flagRow).join('') : '<p class="ok-line">' + ic('check') + 'Sin redundancias ni desequilibrios claros.</p>') +
    '<button class="btn btn-ghost" data-act="coachAsk" data-q="Revisa mi rutina: ¿es redundante, le falta algo o hay desequilibrios? Propón cambios concretos.">' + ic('sparkle') + 'Pedir revisión al coach</button></section>' + exProgressList();
}
function exProgressList() {
  const H = idx().hist, seen = {}, rows = [];
  for (const d of routineDays()) for (const e of d.exercises || []) {
    const k = exKey(e);
    if (seen[k] || e.type !== 'reps') continue;
    seen[k] = true;
    const h = (H[k] || []).slice(0, 10).reverse();
    if (!h.length) continue;
    const v = h.map((x) => bestE1(x.sets));
    const last = v[v.length - 1], firstV = v[0];
    const ch = firstV ? ((last - firstV) / firstV) * 100 : 0;
    rows.push('<button class="exp" data-act="exChart" data-k="' + esc(k) + '" data-n="' + esc(e.name) + '"><span class="exp-n">' + esc(e.name) + '</span><span class="exp-r">' + spark(v) + '<span class="' + (ch > 0.5 ? 'trend-up' : ch < -0.5 ? 'trend-down' : 'trend-flat') + ' small">' + (h.length > 1 ? fmtSigned(ch, 0) + ' %' : '—') + '</span></span><span class="exp-s">' + esc(fmtSets(h[h.length - 1].sets, 'reps')) + ' · 1RM est. ' + fmt(last, 1) + ' kg</span></button>');
  }
  if (!rows.length) return '<section class="card"><h3>Progreso por ejercicio</h3><p class="muted">Aparecerá cuando registres tus primeros entrenos.</p></section>';
  return '<section class="card"><div class="card-h"><h3>Progreso por ejercicio</h3><span class="muted small">1RM estimado</span></div>' + rows.join('') + '</section>';
}
ACT.exChart = (el) => {
  const k = el.dataset.k, h = (idx().hist[k] || []).slice(0, 40).reverse();
  const pts = h.map((x) => ({ k: x.date, y: rnd(bestE1(x.sets), 1) })).filter((p) => p.y > 0);
  sheet(lineChart({ pts, unit: 'kg', label: '1RM estimado de ' + el.dataset.n, empty: 'Sin datos' }) +
    '<p class="small muted">1RM estimado con la fórmula de Epley a partir de tu mejor serie de cada día.</p>' +
    tableView(h.map((x) => [fmtD(x.date, 'dmy'), fmtSets(x.sets, 'reps')]), ['Fecha', 'Series']), { title: el.dataset.n });
};

function myFoods() { return S.myfoods || (S.myfoods = { items: [], recent: [] }); }
function rememberFoods(items, comboName) {
  const M = myFoods();
  items.forEach((it) => {
    const key = norm(it.n);
    M.recent = M.recent.filter((r) => norm(r.n) !== key);
    M.recent.unshift({ n: it.n, q: it.q, u: it.u || 'g', kcal: it.kcal, p: it.p, c: it.c, f: it.f, fib: it.fib || 0 });
  });
  M.recent = M.recent.slice(0, 40);
  if (comboName) {
    M.items = M.items.filter((x) => norm(x.n) !== norm(comboName));
    M.items.unshift({ n: comboName, combo: items.map((it) => ({ n: it.n, q: it.q, u: it.u || 'g', kcal: it.kcal, p: it.p, c: it.c, f: it.f, fib: it.fib || 0 })) });
    M.items = M.items.slice(0, 60);
  }
  Store.save('foods/custom', M);
}
